const ZPAGES={
 sobre:['Sobre o Grupo Zart',()=>`
  <p><b>Grupo Zart</b> é um grupo de projetos digitais independentes: sites, jogos e ferramentas criados com cuidado e com identidade própria. Cada projeto Zart resolve uma coisa diferente, mas todos seguem o mesmo padrão de qualidade, transparência e respeito a quem usa.</p>
  <h2>O que é o Grupo Zart</h2><p>O Grupo Zart reúne projetos digitais criados de forma independente. A ideia é simples: em vez de vários sites soltos, cada um com uma cara, todos fazem parte de uma mesma marca, com a mesma identidade e o mesmo cuidado.</p>
  <h2>Como funciona</h2><p>Cada área do grupo ganha o nome Zart mais o que ela faz. O <b>FutFut</b> faz parte da <b>Zart Jogos</b>. O primeiro projeto do grupo é a <a href="https://projetozartoficial.github.io/dominios/" target="_blank" rel="noopener">Zart Domínios<span class="somente-leitor"> (abre em nova aba)</span></a>, um site para pesquisar e registrar domínios.</p>
  <h2>O que todo projeto Zart tem em comum</h2><ul>
  <li><b>Visual da marca:</b> a coroa, o azul meia-noite, o azul-escuro e o preto.</li>
  <li><b>Transparência:</b> avisamos quando um link é de parceiro e não inventamos avaliações nem promessas.</li>
  <li><b>Privacidade:</b> só pedimos os dados necessários e nada de rastreamento sem permissão.</li>
  <li><b>Acessibilidade:</b> sites que funcionam no celular, no teclado e com leitores de tela.</li></ul>
  <h2>Sobre o FutFut</h2><p>O FutFut é um jogo de futebol de fã, gratuito e sem fins lucrativos, com dois modos: Leilão e Modo Carreira Técnico. Ele não tem ligação oficial com clubes, ligas, confederações, competições, jogadores nem com outros jogos de leilão de futebol.</p>`],
 termos:['Termos de Uso',()=>`
  <p class="mut">Última atualização: ${ZART.atualizado}</p>
  <h2>1. O que é o FutFut</h2><p>O FutFut é um jogo de navegador gratuito, feito para diversão, com os modos Leilão e Modo Carreira Técnico. Ele faz parte da Zart Jogos, do grupo Zart. Ao usar o jogo, você concorda com estes termos.</p>
  <h2>2. Jogo de fã, sem ligação oficial</h2><p>O FutFut é um projeto de fã, sem fins lucrativos. Ele <b>não tem ligação, patrocínio nem autorização</b> de clubes, ligas, confederações (como FIFA, UEFA, CONMEBOL e CBF), organizadores de competições, jogadores, nem de outros jogos de leilão de futebol. Nomes de clubes, competições e jogadores aparecem só como referência, para identificar o que está sendo simulado. Todas as marcas pertencem aos seus donos.</p>
  <p>Os escudos do jogo são desenhos próprios, feitos só com as cores dos clubes; nenhum logo oficial é usado. Overalls, valores de mercado, salários, contratos, transferências e resultados são <b>fictícios</b>, gerados pelo jogo, e não representam avaliações reais de ninguém.</p>
  <p>Se você é dono de algum direito e quer que algo seja alterado ou removido, escreva para <a href="mailto:${ZART.email}">${ZART.email}</a>.</p>
  <h2>3. Uso permitido</h2><p>Você pode jogar livremente para uso pessoal. Não é permitido usar o jogo para atividades ilegais, tentar prejudicar o funcionamento do site ou republicar o jogo dizendo que é seu.</p>
  <h2>4. Dinheiro do jogo</h2><p>Os valores em reais (R$) e euros (€) dentro do jogo são <b>fictícios</b>. Eles não valem dinheiro, não podem ser comprados nem trocados por nada.</p>
  <h2>5. Progresso salvo</h2><p>Se você permitir, o progresso fica guardado só no seu navegador. Ele pode ser perdido se você limpar os dados do navegador, trocar de aparelho ou se o jogo for atualizado. O jogo é oferecido "como está", sem garantia de que estará sempre disponível ou sem erros.</p>
  <h2>6. Mudanças</h2><p>Estes termos podem ser atualizados. A data no topo mostra a última versão.</p>
  <h2>7. Lei aplicável</h2><p>Estes termos seguem as leis do Brasil, incluindo o Código de Defesa do Consumidor e a Lei Geral de Proteção de Dados (LGPD).</p>
  <h2>8. Contato</h2><p>Responsável: ${ZART.resp} · <a href="mailto:${ZART.email}">${ZART.email}</a> · ${ZART.doc?`CPF/CNPJ: ${ZART.doc}`:aPreencher('CPF/CNPJ (se exigido)')}</p>`],
 privacidade:['Política de Privacidade',()=>`
  <p class="mut">Última atualização: ${ZART.atualizado}</p>
  <p>Esta política explica, de acordo com a Lei Geral de Proteção de Dados (Lei 13.709/2018, a LGPD), como o FutFut trata informações. Resumo: <b>o FutFut não coleta dados pessoais para nós</b>. O que você digita fica no seu próprio navegador.</p>
  <h2>1. Quem é o responsável</h2><p>Controlador: ${ZART.resp}, do grupo Zart · contato: <a href="mailto:${ZART.email}">${ZART.email}</a> · ${ZART.doc?`CPF/CNPJ: ${ZART.doc}`:aPreencher('CPF/CNPJ (se exigido)')}</p>
  <h2>2. Quais informações e para quê</h2><ul>
  <li><b>Nome de técnico</b> que você digita: usado só para mostrar o seu nome dentro do jogo. Pode ser um apelido; não precisa ser o seu nome real.</li>
  <li><b>Progresso do jogo</b> (carreira, elenco, escolhas): usado só para você continuar de onde parou.</li>
  <li><b>Sua escolha de privacidade</b> (aceitou ou recusou): usada para lembrar a sua decisão.</li></ul>
  <p>Não pedimos e-mail, telefone, CPF, endereço, localização nem dados de pagamento. Não há cadastro, login, anúncios, Google Analytics, pixels ou qualquer rastreamento.</p>
  <h2>3. Onde ficam guardadas</h2><p>Só no <b>armazenamento local do seu navegador</b> (localStorage), no seu aparelho. Nada é enviado para servidores do grupo Zart. O jogo não carrega fontes, scripts ou imagens de outros sites.</p>
  <h2>4. Base legal</h2><p>Guardar a carreira e as escolhas depende do seu <b>consentimento</b> (art. 7º, I, da LGPD), dado no aviso de privacidade. Guardar a própria escolha (aceitar ou recusar) é necessário para respeitar a sua decisão.</p>
  <h2>5. Com quem compartilhamos</h2><p>Com ninguém. A plataforma que hospeda a página onde o jogo roda pode registrar dados técnicos de acesso (como endereço IP e navegador), conforme a política de privacidade dela; o grupo Zart não recebe esses dados.</p>
  <h2>6. Por quanto tempo</h2><p>Até você apagar: pelo botão abaixo, recusando o armazenamento ou limpando os dados do navegador.</p>
  <h2>7. Seus direitos</h2><p>Pela LGPD (art. 18) você pode confirmar se há tratamento, acessar, corrigir, apagar, levar seus dados para outro lugar e revogar o consentimento a qualquer momento. Como tudo fica no seu aparelho, você mesmo faz isso: veja e corrija pelo próprio jogo, mude a escolha em "Preferências de armazenamento" ou apague tudo no botão abaixo. Dúvidas ou pedidos: <a href="mailto:${ZART.email}">${ZART.email}</a>, com resposta em até 15 dias.</p>
  <div class="card" style="margin:14px 0"><b>Apagar meus dados deste navegador</b><p class="mut small" style="margin:6px 0 10px">Remove a carreira salva e a sua escolha de privacidade. Não dá para desfazer.</p><button class="btn" data-act="zWipe">Apagar meus dados</button></div>
  <h2>8. Crianças e adolescentes</h2><p>O jogo não pede dados pessoais. Recomendamos que menores de 18 anos usem o jogo com acompanhamento de um responsável.</p>
  <h2>9. Mudanças</h2><p>Se esta política mudar, a data no topo será atualizada.</p>`],
 cookies:['Armazenamento e cookies',()=>`
  <p class="mut">Última atualização: ${ZART.atualizado}</p>
  <p>O FutFut <b>não usa cookies</b>. Ele usa o armazenamento local do navegador (localStorage), que funciona de forma parecida, só no seu aparelho.</p>
  <table><tr><th class="l">O que fica guardado</th><th class="l">Tipo</th><th class="l">Quando</th></tr>
  <tr><td class="l">Sua escolha de privacidade (aceitar ou recusar)</td><td class="l">Essencial</td><td class="l">Sempre que você escolhe</td></tr>
  <tr><td class="l">Carreira salva (Modo Carreira Técnico)</td><td class="l">Funcional</td><td class="l">Só se você aceitar</td></tr></table>
  <p>Não usamos cookies de análise, publicidade ou de terceiros. Se algum dia isso mudar, eles só vão carregar depois de você aceitar.</p>
  <p>Estado atual: <b>${zCons()?(zCanSave()?'você aceitou guardar o progresso neste navegador':'você recusou; nada além da sua escolha é guardado'):'você ainda não escolheu'}</b>.</p>
  <button class="btn" data-act="zPrefs">Mudar minha escolha</button>`],
 reembolso:['Política de Reembolso',()=>`
  <p class="mut">Última atualização: ${ZART.atualizado}</p>
  <p>O FutFut é <b>100% gratuito</b>. Não vende nada: não tem assinatura, compras dentro do jogo, moedas pagas nem anúncios. Os valores em R$ e € que aparecem no jogo são fictícios.</p>
  <p>Como não existe nenhuma cobrança, também não há o que cancelar ou reembolsar.</p>
  <h2>Se um dia houver venda</h2><p>Se algum produto ou serviço pago for oferecido no futuro, valerá o <b>direito de arrependimento de 7 dias</b> do Código de Defesa do Consumidor (art. 49): em compras feitas pela internet, você pode desistir em até 7 dias corridos depois da compra ou do recebimento e receber de volta tudo o que pagou, sem precisar explicar o motivo. As regras completas seriam publicadas aqui antes de qualquer venda.</p>
  <p>Dúvidas: <a href="mailto:${ZART.email}">${ZART.email}</a></p>`]
};
let ZBACK=null;
function renderPage(k){
 const p=ZPAGES[k];if(!p)return;
 if(typeof CLV!=='undefined'&&CLV&&!CLV.done)return;
 clearInterval(TICK);
 app.innerHTML=`<header class="top"><div class="logo">${LOGO}</div><span class="grow"></span><button class="btn sm" data-act="zBack">← Voltar</button></header>
 <main class="wrap zpage"><h1>${p[0]}</h1>${p[1]()}</main>${FOOT}`;
 window.scrollTo(0,0);const h=document.querySelector('main h1');if(h){h.setAttribute('tabindex','-1');h.focus()}
}
Object.assign(ACT,{
 page(b){if(!ZBACK)ZBACK=document.querySelector('.cnav')?'career':'home';if(typeof closeModal==='function')closeModal();renderPage(b.dataset.v)},
 zBack(){const w=ZBACK;ZBACK=null;if(w==='career'&&typeof C!=='undefined'&&C)cRender();else renderHome()},
 zAccept(){zSetCons(true);const d=document.querySelector('.zcons');if(d)d.remove();if(typeof C!=='undefined'&&C&&typeof cSave==='function')cSave();zNotice('Escolha salva: o progresso fica guardado neste navegador.')},
 zRefuse(){zSetCons(false);const d=document.querySelector('.zcons');if(d)d.remove();zNotice('Escolha salva: nada além dela é guardado. A carreira não fica salva ao fechar.')},
 zPrefs(){zBanner(true)},
 zWipe(){try{Object.keys(localStorage).forEach(k=>{if(k.startsWith('futfut'))localStorage.removeItem(k)})}catch(e){}if(typeof C!=='undefined')C=null;zNotice('Seus dados foram apagados deste navegador.');renderHome();setTimeout(()=>zBanner(),50)}
});
function zNotice(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ----- acessibilidade: área principal, modais, Esc ----- */
function zA11y(){
 const m=app.querySelector('main');if(m){m.id='conteudo';m.setAttribute('tabindex','-1')}
 app.querySelectorAll('.crest').forEach(c=>{if(!c.hasAttribute('role')){c.setAttribute('role','img');const b=c.querySelector('b');c.setAttribute('aria-label','Escudo '+(b?b.textContent:''))}});
}
if(typeof MutationObserver!=="undefined")new MutationObserver(zA11y).observe(app,{childList:true});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape')return;
 const mb=document.querySelector('#modal .mbox');if(mb){const x=document.querySelector('#modal [data-act=cClose]');if(x)x.click();e.preventDefault();return}
});

renderHome();zBanner();
</script>
</body>
</html>
