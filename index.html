<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leilão Infinito</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Leilão Infinito — paleta: verde gramado (#0a1a11 / #1f9d55), ouro da nota (#f7d24c), branco giz.
   Tipografia: Barlow Condensed (placar, números, títulos) + Barlow (texto). Layout mobile-first. */
:root{--bg:#08140d;--bg2:#0d1f15;--card:#102419;--card2:#163121;--line:#24402f;--tx:#eef6f0;--mut:#93ad9c;--ac:#f7d24c;--ac2:#e0a92a;--gr:#2ecc71;--rd:#ef5350;--r:16px;--sh:0 10px 30px #0007;--fd:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;min-height:100vh;
 background:radial-gradient(1200px 600px at 50% -200px,#1d5a36 0,transparent 70%),repeating-linear-gradient(90deg,var(--bg) 0 90px,#0a1710 90px 180px)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#08140dd9;backdrop-filter:blur(10px);z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--fd);letter-spacing:.3px;text-transform:uppercase}
.logo svg{width:44px;height:26px;flex:none;filter:drop-shadow(0 2px 4px #0008)}
.logo em{font-style:normal;color:var(--ac)}
.grow{flex:1}
@media(max-width:640px){.top{position:static}.top .btn.sm{width:100%}}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px}
h1,h2,h3{font-family:var(--fd);letter-spacing:.2px;line-height:1.05}
h1{margin:6px 0 6px;font-size:clamp(34px,6vw,52px);text-wrap:balance}h2{margin:0 0 10px;font-size:26px}h3{margin:26px 0 10px;font-size:21px}
.mut{color:var(--mut)}.small{font-size:13px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:8px 0 4px}
.hero .note{width:min(260px,38vw);transform:rotate(-6deg);filter:drop-shadow(0 14px 22px #000a);animation:flt 5s ease-in-out infinite}
@keyframes flt{50%{transform:rotate(-3deg) translateY(-6px)}}
@media(max-width:560px){.hero{grid-template-columns:1fr}.hero .note{width:220px;margin:0 auto;order:-1}}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;transition:border-color .2s}
.input:focus{border-color:var(--ac);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.opt{text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:3px;min-height:72px}
.opt b{font:700 19px/1.1 var(--fd)}.opt span{color:var(--mut);font-size:13px;line-height:1.35}
.opt:hover{border-color:#3d6b50}
.opt.sel{border-color:var(--ac);background:linear-gradient(180deg,#2a3d1c,#1a2d1f);box-shadow:0 0 0 3px #f7d24c22}.opt.sel b{color:var(--ac)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line)}
.forms button{background:none;border:0;border-radius:9px;padding:8px 2px;font:700 16px/1.1 var(--fd);color:var(--mut);display:flex;flex-direction:column;align-items:center;min-height:44px;justify-content:center}
.forms button:hover:not(:disabled){background:#ffffff0a;color:var(--tx)}
.forms button small{font:500 10px Barlow,sans-serif}.forms button.sel{background:#04100a;color:var(--gr);box-shadow:inset 0 0 0 1px #2ecc7155}.forms button:disabled{opacity:.22}
.count{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.count b{font:800 34px var(--fd);min-width:40px;text-align:center}
.cbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card2);font-size:22px}
.btn{border-radius:12px;padding:12px 16px;font:800 17px var(--fd);letter-spacing:.4px;text-transform:uppercase;background:var(--card2);border:1.5px solid var(--line);min-height:46px}
.btn:hover:not(:disabled){border-color:#4a7d5e}
.btn.ac{background:linear-gradient(180deg,#ffe27a,var(--ac) 45%,var(--ac2));color:#1b1400;border-color:#ffe58a;box-shadow:0 6px 18px #f7d24c33}
.btn.ac:hover:not(:disabled){box-shadow:0 8px 26px #f7d24c66}
.btn.block{width:100%;font-size:20px;padding:15px}.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:14px;min-height:38px}
.card{background:linear-gradient(180deg,#132a1d,var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px}
footer.foot{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px 34px;border-top:1px solid #ffffff10;margin-top:20px}
/* escudo */
.crest{position:relative;display:inline-grid;place-items:center;width:32px;height:36px;flex:none;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:7px;box-shadow:inset 0 0 0 2px #0003}
.crest b{font:800 9px/1 var(--fd);color:#fff;background:#000b;padding:1px 3px;border-radius:3px;letter-spacing:.3px}
.crest:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff40,transparent 45%,#0003)}
.crest.sm{width:22px;height:25px;padding-bottom:5px}.crest.sm b{font-size:7px;padding:0 2px}
.crests{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.crests button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.crests button:hover{border-color:#3d6b50;color:var(--tx)}
.crests button.sel{border-color:var(--gr);background:#16361f;color:var(--tx);box-shadow:0 0 0 3px #2ecc7122}
.crests button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* campo */
.pitch{position:relative;width:100%;aspect-ratio:10/11;border-radius:14px;background:radial-gradient(circle at 50% 48%,transparent 13%,#ffffff26 13.4%,transparent 14%),linear-gradient(#ffffff26,#ffffff26) 0 48%/100% 2px no-repeat,repeating-linear-gradient(0deg,#1c8a4a 0 10%,#219552 10% 20%);border:2px solid #3cb36d;overflow:hidden;box-shadow:inset 0 0 40px #0004,0 8px 20px #0005}
.pitch:after{content:"";position:absolute;left:50%;bottom:0;width:38%;height:13%;border:2px solid #ffffff2a;border-bottom:0;transform:translateX(-50%)}
.pitch:before{content:"";position:absolute;left:50%;top:0;width:38%;height:9%;border:2px solid #ffffff2a;border-top:0;transform:translateX(-50%)}
.pitch.blue{background:radial-gradient(circle at 50% 48%,transparent 13%,#ffffff26 13.4%,transparent 14%),repeating-linear-gradient(0deg,#2f5fc4 0 10%,#3366cc 10% 20%);border-color:#5a86e0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:23%;z-index:2}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--fd);border:2px solid #fff;background:#0d2a1a;box-shadow:0 3px 6px #0007;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
.dot.empty{border:2px dashed #ffffffb0;background:#ffffff14;color:#fff;font-weight:400;font-size:20px;animation:none}
.slot i{font:700 11px/1.3 Barlow,sans-serif;font-style:normal;margin-top:3px;background:#06140ccc;padding:1px 7px;border-radius:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i.bad{color:#ffb4a8}
.mini .dot{width:15px;height:15px;font-size:8px;border-width:1px;box-shadow:none}.mini .dot.empty{font-size:0;border-width:1px}
.mini .slot i{font-size:6px;padding:0 3px;margin-top:1px}
.mini{border-radius:8px;border-width:1px;box-shadow:none}.mini:before,.mini:after{border-width:1px}
.G{background:#c99512!important;color:#111}.D{background:#2f6fd6!important}.M{background:#18914d!important}.A{background:#d64545!important}
.pos{display:inline-block;font:800 12px var(--fd);letter-spacing:.4px;padding:2px 7px;border-radius:6px}
/* leilão */
.auc{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.2fr);grid-template-areas:"me lot bots";max-width:1400px;margin:0 auto;padding:16px}
@media(max-width:1000px){.auc{grid-template-columns:1fr 1fr;grid-template-areas:"lot lot" "me bots"}}
@media(max-width:640px){.auc{grid-template-columns:1fr;grid-template-areas:"lot" "me" "bots"}}
.player{position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,#fff3b8 0,#f7d24c 35%,#c99512 100%);color:#231a00;box-shadow:0 10px 24px #0008,inset 0 0 0 2px #fff6;overflow:hidden;animation:enter .4s ease-out}
.player:after{content:"";position:absolute;inset:-40% auto -40% -30%;width:30%;background:linear-gradient(90deg,transparent,#ffffff8c,transparent);transform:rotate(20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,60%{left:-30%}100%{left:130%}}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}}
.ovr{font:900 58px/1 var(--fd);min-width:66px;text-align:center}
.ovr small{display:block;font-size:12px;letter-spacing:1px;opacity:.7}
.pname{font:800 28px/1.02 var(--fd);text-wrap:balance}
.player .mut{color:#4a3a00}
.price{font:900 52px/1 var(--fd);color:var(--ac);font-variant-numeric:tabular-nums}
.price.bump{animation:bump .3s}@keyframes bump{50%{transform:scale(1.15);color:#fff}}
.bar{height:10px;background:#0008;border-radius:6px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:linear-gradient(90deg,#27ae60,var(--gr));transition:width .35s linear}
.bar.low div{background:linear-gradient(90deg,#c0392b,var(--rd))}
.bids{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.bids .btn{padding:14px 2px;font-size:22px}
.log{max-height:140px;overflow:auto;font-size:14px;color:var(--mut);margin-top:10px}.log div{padding:4px 0;border-bottom:1px solid #ffffff0d}.log div:first-child{color:var(--tx);font-weight:600}
.bots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
@media(max-width:640px){.bots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bot{border-radius:12px;padding:6px;border:2px solid transparent;background:#ffffff06;transition:border-color .2s,background .2s}.bot.lead{border-color:var(--ac);background:#f7d24c1a}
.bot .hd{display:flex;align-items:center;gap:5px;font:700 14px var(--fd);margin-bottom:5px}
.bot .hd b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nota{font:900 16px var(--fd);color:var(--gr);margin-top:3px}.nota small{color:var(--mut);font-size:10px;margin-left:3px;letter-spacing:.6px}
.res{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#1d3a27,#0d1f15);border:2px solid var(--ac);padding:18px 26px;border-radius:18px;font:800 24px/1.15 var(--fd);text-align:center;z-index:20;display:none;max-width:90vw;box-shadow:0 20px 50px #000c;animation:enter .25s ease-out}
.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:760px){.layout{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--mut);font-weight:600}td.l,th.l{text-align:left}
tr.me td{background:#1f3d26}
.board{background:linear-gradient(180deg,#0b0f0c,#151c17);border:2px solid #2c3a30;border-radius:16px;padding:14px;box-shadow:inset 0 2px 0 #ffffff10}
.score{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px;font:700 18px/1.1 var(--fd);text-align:center}
.score .n{font:900 60px/1 var(--fd);color:var(--ac);min-width:48px;text-shadow:0 0 18px #f7d24c55}
.ev{font-size:15px;padding:6px 0;border-bottom:1px solid #ffffff0d;animation:enter .3s}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;padding:10px 6px;border-radius:10px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:14px;min-height:44px}
.seg button.sel{border-color:var(--ac);color:var(--ac);background:#2a3d1c}
.match{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:15px}
.match>span{flex:1;display:flex;align-items:center;gap:6px}.match>span:last-child{justify-content:flex-end;text-align:right}
.match b{font:800 19px var(--fd)}
.squads{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pl{display:flex;justify-content:space-between;gap:6px;font-size:14px;padding:4px 0;border-bottom:1px solid #ffffff0a}
.tag{font:700 14px var(--fd);letter-spacing:.3px;padding:5px 11px;border-radius:20px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.trophy{width:120px;filter:drop-shadow(0 10px 20px #f7d24c55);animation:flt 4s ease-in-out infinite}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

function pen(a,b){if(a===b)return .93;if(a==='G'||b==='G')return .45;const o='DMA';return Math.abs(o.indexOf(a)-o.indexOf(b))===1?.82:.68}
const effOf=(p,s)=>p.ps.includes(s.pos)?p.ovr:Math.round(p.ovr*pen(p.g,s.g));

/* casamento jogador→vaga (posição exata) */
function assign(players,slots){
 const n=slots.length,own=new Array(n).fill(-1);
 for(let i=0;i<players.length;i++){
  const seen=new Array(n).fill(false);
  const aug=k=>{const p=players[k];const ord=[...slots.keys()].filter(s=>p.ps.includes(slots[s].pos)).sort((a,b)=>p.ps.indexOf(slots[a].pos)-p.ps.indexOf(slots[b].pos));
   for(const s of ord){if(seen[s])continue;seen[s]=true;if(own[s]<0||aug(own[s])){own[s]=k;return true}}return false};
  if(!aug(i))return null;
 }
 return own.map(i=>i<0?null:players[i]);
}
const squadP=t=>t.squad.map(s=>s.p);
function lineup(t,form,strict){
 const sl=slotList(form).map(s=>({...s,p:null,eff:0}));if(!t||!t.squad.length)return sl;
 const pl=squadP(t),a=assign(pl,sl);
 if(a){sl.forEach((s,i)=>{if(a[i]){s.p=a[i];s.eff=a[i].ovr}});if(strict||t.squad.length>=sl.length||a.filter(Boolean).length===pl.length)return sl}
 if(strict)return sl;
 sl.forEach(s=>{s.p=null;s.eff=0});
 const pairs=[];pl.forEach(p=>sl.forEach((s,i)=>pairs.push({p,i,e:effOf(p,s),ex:p.ps.includes(s.pos)})));
 pairs.sort((a,b)=>(b.ex-a.ex)||(b.e-a.e));const used=new Set();
 pairs.forEach(x=>{if(used.has(x.p)||sl[x.i].p)return;used.add(x.p);sl[x.i].p=x.p;sl[x.i].eff=x.e});
 return sl;
}
function pitchHTML(t,form,strict,mini){

  const bad=!s.p.ps.includes(s.pos);
  return `<div class="slot" style="left:${s.x}%;top:${s.y}%"><div class="dot ${s.g}">${S.cfg.showOvr||S.reveal?s.eff:'?'}</div><i class="${bad?'bad':''}">${mini?s.pos:esc(s.p.short)}</i></div>`}).join('')}</div>`;
}

function formsHTML(size,cur,act,allowed){return `<div class="forms">${FORMS[size].map(([f,s])=>`<button class="${f===cur?'sel':''}" data-act="${act}" data-v="${f}" ${allowed&&!allowed(f)?'disabled':''}>${f}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`}

/* ================== LEILÃO ================== */
const totFree=t=>slotList(t.form).length-t.squad.length;
const spendable=t=>t.money-(totFree(t)-1);
const canTake=(t,p)=>totFree(t)>0&&!!assign([...squadP(t),p],slotList(t.form));
const freePos=t=>{const sl=slotList(t.form),a=assign(squadP(t),sl)||[];return sl.filter((s,i)=>!a[i]).map(s=>s.pos)};
let TICK=null;

function start(){
 const c=S.cfg;clearInterval(TICK);
 const db=DB[c.mode];S.pool=shuffle(db.pl.map(p=>({...p})));
 const sorted=S.pool.map(p=>p.ovr).sort((a,b)=>a-b);
 S.pct=o=>{let k=0;while(k<sorted.length&&sorted[k]<o)k++;return k/(sorted.length-1)};
 S.reveal=false;S.unsold=[];S.lotN=0;S.gen=0;
 const mine=db.cl.find(x=>x.sig===c.club)||db.cl[0];
 const others=shuffle(db.cl.filter(x=>x!==mine)),names=shuffle([...COACH[c.mode]]);
 S.techs=[{id:0,name:c.name.trim()||'Você',isUser:true,money:c.budget,spent:0,form:c.form,squad:[],crest:mine,tac:{post:'equ',est:'equ'}}];
 for(let i=1;i<=c.nBots;i++)S.techs.push({id:i,name:names[i-1]+' Bot',isUser:false,money:100,spent:0,form:pick(BOT_FORMS[c.size]),squad:[],crest:others[i-1],pers:rnd(.8,1.25),tac:{post:'equ',est:'equ'}});
 S.totalSlots=S.techs.length*c.size;
 nextLot();
}
function generic(pos){S.gen++;return{id:'GEN'+S.gen,name:'Reserva '+S.gen,short:'Reserva',ps:[pos],pos,g:GOF[pos],ovr:ri(68,73),club:'Sem clube',sig:'---',color:'#555'}}
function drawLot(skipUser){
 const need=[];S.techs.forEach(t=>{if(skipUser&&t.isUser)return;if(spendable(t)<1)return;need.push(...freePos(t))});
 if(!need.length)return null;
 const pos=pick(need),cand=S.pool.filter(p=>p.ps.includes(pos));
 if(!cand.length)return generic(pos);
 const p=pick(cand);S.pool.splice(S.pool.indexOf(p),1);return p;
}
function botMax(t,p){
 if(spendable(t)<1||!canTake(t,p))return 0;
 const bps=100/S.cfg.size,pc=S.pct(p.ovr);
 let v=bps*(.35+3.4*pc**3);
 const urg=Math.min(2.2,Math.max(.6,(t.money/totFree(t))/bps));
 v*=t.pers*urg*rnd(.85,1.15);
 if(totFree(t)===1)v=spendable(t);
 return Math.max(1,Math.min(Math.round(v),spendable(t)));
}
function nextLot(){
 const p=drawLot(false);if(!p)return endAuction();
 S.lotN++;const L=S.lot={p,price:0,leader:null,timer:S.cfg.fast?6:10,start:S.cfg.fast?6:10,log:[],max:{},userOk:canTake(T(0),p)};
 S.techs.forEach(t=>{if(!t.isUser)L.max[t.id]=botMax(t,p)});
 renderAuction();clearInterval(TICK);TICK=setInterval(tick,350);
}
function placeBid(t,amount){const L=S.lot;L.price=amount;L.leader=t;L.log.unshift(`${t.name} deu ${brl(amount)}`);L.timer=Math.max(L.timer,S.cfg.fast?3:5)}
function tick(){
 const L=S.lot;if(!L)return;L.timer-=.35;
 if(L.timer<=0)return resolveLot();
 const c=S.techs.filter(t=>!t.isUser&&L.leader!==t&&L.max[t.id]>=L.price+1);
 if(c.length&&Math.random()<(L.timer<2.5?.75:.35)){const t=pick(c),room=L.max[t.id]-L.price;let inc=1;if(room>4&&Math.random()<.5)inc=ri(1,Math.max(1,Math.round(room*.35)));placeBid(t,L.price+inc)}
 updLot();
}
function bidAmt(k){const L=S.lot,u=T(0);let a=k==='max'?Math.min(spendable(u),Math.max(L.price+1,...Object.values(L.max).map(v=>v+1))):(L.leader?L.price:0)+ +k;if(a<=L.price)a=L.price+1;return a}
function userBid(k){
 const L=S.lot,u=T(0);if(!L||!L.userOk||L.leader===u)return;
 const amt=bidAmt(k);if(amt>spendable(u)){flash('Sem dinheiro pra esse lance',900);return}
 placeBid(u,amt);updLot();
}
function resolveLot(){
 clearInterval(TICK);const L=S.lot,p=L.p;let msg;
 if(L.leader){const t=L.leader;t.squad.push({p,price:L.price});t.money-=L.price;t.spent+=L.price;
  msg=t.isUser?`✅ ${esc(p.name)} é seu! (${brl(L.price)})`:`${esc(t.name)} levou ${esc(p.name)} por ${brl(L.price)}`}
 else{S.unsold.push(p);msg=`Ninguém quis ${esc(p.name)}`}
 S.lot=null;flash(msg,1100);setTimeout(nextLot,1150);
}
function flash(m,ms){const r=$('#res');r.innerHTML=m;r.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>r.style.display='none',ms)}
function instantResolve(p){
 const bids=S.techs.filter(t=>!t.isUser).map(t=>({t,m:botMax(t,p)})).filter(b=>b.m>0).sort((a,b)=>b.m-a.m);
 if(!bids.length){S.unsold.push(p);return}
 const w=bids[0],price=bids[1]?Math.min(w.m,bids[1].m+1):1;
 w.t.squad.push({p,price});w.t.money-=price;w.t.spent+=price;
}
function simRest(){
 clearInterval(TICK);if(S.lot){S.pool.push(S.lot.p);S.lot=null}
 let p,guard=0;while((p=drawLot(true))&&guard++<3000)instantResolve(p);
 endAuction();
}
function endAuction(){
 clearInterval(TICK);
 const left=shuffle(S.unsold.concat(S.pool));let filled=0;
 S.techs.forEach(t=>{freePos(t).forEach(pos=>{const i=left.findIndex(p=>p.ps.includes(pos));const p=i>=0?left.splice(i,1)[0]:generic(pos);t.squad.push({p,price:0});if(t.isUser)filled++})});
 S.filled=filled;renderSquads();
}

 app.innerHTML=`<header class="top"><div class="logo">${LOGO}Leilão</div><span class="tag">Jogador ${S.lotN} · faltam ${left} vagas</span><span class="grow"></span><button class="btn sm" data-act="simrest">Simular resto do leilão</button></header>

  <div class="row mut small" style="margin-bottom:8px;justify-content:space-between"><span>Gasto: R$ ${u.spent}</span><span>${totFree(u)} vagas livres</span></div>
  ${pitchHTML(u,u.form,true)}
  <div class="row" style="justify-content:space-between;margin-top:8px">${notaHTML(u)}<span class="mut small">${u.squad.length}/${c.size}</span></div>
  <div style="margin-top:8px">${formsHTML(c.size,u.form,'formA',allowed)}</div>
 </section>
 <section style="grid-area:lot"><div class="card">
   <article class="player"><div class="ovr">${showO(p)}<small>OVERALL</small></div>

   <div class="mut small">${L.userOk?`Você pode dar até ${brl(spendable(u))} neste jogador (guarda R$ 1 por vaga que falta).`:'Esse jogador não cabe em nenhuma vaga livre do seu time (troque a formação se quiser).'}</div>
   <div class="bids"><button class="btn" data-act="bid" data-v="1">+1</button><button class="btn" data-act="bid" data-v="5">+5</button><button class="btn" data-act="bid" data-v="10">+10</button><button class="btn" data-act="bid" data-v="50">+50</button></div>

   <div class="log" id="log"></div>
 </div></section>
 <section class="bots" style="grid-area:bots">${S.techs.filter(t=>!t.isUser).map(t=>`<div class="bot" id="bot${t.id}"><div class="hd">${crest(t.crest,1)}<b>${esc(t.name)}</b><span style="color:var(--ac)">${brl(t.money)}</span></div>${pitchHTML(t,t.form,true,true)}${notaHTML(t)}</div>`).join('')}</section>
 </main>`;
 updLot();
}
function updLot(){
 const L=S.lot;if(!L||!$('#price'))return;
 const pe=$('#price'),pt=L.leader?brl(L.price):'—';if(pe.textContent!==pt){pe.textContent=pt;pe.classList.remove('bump');void pe.offsetWidth;pe.classList.add('bump')}
 $('#leader').textContent=L.leader?L.leader.name:'ninguém';$('#leader').style.color=L.leader&&L.leader.isUser?'var(--gr)':'';

 document.querySelectorAll('.bot').forEach(el=>el.classList.toggle('lead',!!L.leader&&el.id==='bot'+L.leader.id));

function squadCard(t){
 const sl=lineup(t,t.form);
 return `<div class="card"><div class="row" style="margin-bottom:6px">${crest(t.crest)}<b class="grow">${esc(t.name)}</b><span class="tag">nota ${S.cfg.showOvr||S.reveal?nota(t):'?'}</span></div>

/* ================== MOTOR DE JOGO ================== */
const R0={},BASE={5:1.8/90,11:1.35/90};
function rawStr(sl){let atk=0,def=0,sum=0;sl.forEach(s=>{const e=s.p?s.eff:40;sum+=e;if(s.g==='G')def+=e*1.6;else if(s.g==='D'){def+=e;atk+=e*.1}else if(s.g==='M'){def+=e*.45;atk+=e*.45}else{atk+=e;def+=e*.1}});return{atk,def,avg:sum/sl.length}}
[5,11].forEach(n=>{const f=n===5?'2-1-1':'4-4-2';const r=rawStr(slotList(f).map(s=>({...s,p:1,eff:75})));R0[n]=r.atk/r.def});
function str(t,opp){
 const r=rawStr(lineup(t,t.form));const tc=t.tac;
 if(tc.post==='ofe'){r.atk*=1.15;r.def*=.86}if(tc.post==='def'){r.atk*=.82;r.def*=1.15}
 if(tc.est==='posse'){r.def*=1.06}if(tc.est==='pressao'){r.atk*=1.07;r.def*=.95}if(tc.est==='contra')r.atk*=opp.tac.post==='ofe'?1.12:.97;
 return r;
}
const lam=(a,b)=>BASE[S.cfg.size]*Math.pow((a.atk/b.def)/R0[S.cfg.size],1.3)*Math.exp((a.avg-b.avg)*.09);
function scorer(t){const sl=lineup(t,t.form).filter(s=>s.p&&s.g!=='G');const w=sl.map(s=>({D:.4,M:1.5,A:4}[s.g])*s.eff/70);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<sl.length;i++){r-=w[i];if(r<0)return sl[i].p.name}return sl[0]?sl[0].p.name:'?'}
function botTac(t,m,home){
 if(t.isUser)return;const gf=home?m.gh:m.ga,ga=home?m.ga:m.gh;
 if(m.min===0)t.tac={post:pick(['equ','equ','ofe','def']),est:pick(['equ','posse','pressao','contra'])};
 else if(m.min>=65&&gf<ga)t.tac.post='ofe';else if(m.min>=75&&gf>ga)t.tac.post='def';
}
function newMatch(h,a,ko){const m={h,a,gh:0,ga:0,min:0,ev:[],ko,pens:null};botTac(T(h),m,true);botTac(T(a),m,false);return m}
function step(m){
 const H=T(m.h),A=T(m.a);m.min++;botTac(H,m,true);botTac(A,m,false);
 const sh=str(H,A),sa=str(A,H);const lh=lam(sh,sa),la=lam(sa,sh);
 if(Math.random()<lh){m.gh++;m.ev.push({min:m.min,side:'h',who:scorer(H)})}
 if(!(m.min>90&&m.gh!==m.ga)&&Math.random()<la){m.ga++;m.ev.push({min:m.min,side:'a',who:scorer(A)})}
}
function over(m){if(m.min<90)return false;if(!m.ko||m.gh!==m.ga)return true;if(m.min>=120){if(!m.pens)m.pens=pens(m);return true}return false}
function pens(m){
 const H=T(m.h),A=T(m.a),gk=t=>lineup(t,t.form)[0].eff||50,tk=t=>lineup(t,t.form).filter(s=>s.g!=='G'&&s.p).sort((a,b)=>b.eff-a.eff);
 const th=tk(H),ta=tk(A),gh=gk(H),ga=gk(A),kick=(s,g)=>Math.random()<Math.min(.92,Math.max(.55,.75+(s.eff-g)/120));
 let ph=0,pa=0,i=0;for(;i<5;i++){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh)}
 while(ph===pa){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh);i++}
 return{h:ph,a:pa};
}
const winner=m=>m.gh>m.ga?m.h:m.ga>m.gh?m.a:(m.pens.h>m.pens.a?m.h:m.a);
function simAll(m){while(!over(m))step(m);return m}
const scoreTxt=m=>`${m.gh} x ${m.ga}${m.pens?` (pên. ${m.pens.h}x${m.pens.a})`:m.min>90?' (prorr.)':''}`;

/* ================== CAMPEONATO ================== */
function roundRobin(ids,double){let a=[...ids];if(a.length%2)a.push(null);const n=a.length,R=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i];if(h!=null&&w!=null)m.push(r%2?[w,h]:[h,w])}R.push(m);a=[a[0],a[n-1],...a.slice(1,n-1)]}
 if(double)R.push(...R.map(m=>m.map(([h,w])=>[w,h])));return R}
function bracketOrder(n){let o=[0,1];while(o.length<n){const m=o.length*2;o=o.flatMap(x=>[x,m-1-x])}return o}
function initKO(seeds){let size=2;while(size<seeds.length)size*=2;const arr=bracketOrder(size).map(i=>seeds[i]??null);const R=[];for(let i=0;i<size;i+=2)R.push([arr[i],arr[i+1]]);S.tour.ko={rounds:[R],res:[],cur:0};S.tour.stage='ko'}
function initTour(){
 const ids=S.techs.map(t=>t.id),f=S.cfg.format;S.tour={stage:'league',table:{},rounds:[],ri:0,last:null,ko:null};
 if(f==='ko')initKO(shuffle(ids));
 else{S.tour.rounds=roundRobin(shuffle(ids),f==='league'&&ids.length<=8);ids.forEach(id=>S.tour.table[id]={id,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0})}
 renderHub();
}
function standings(){return Object.values(S.tour.table).sort((a,b)=>b.P-a.P||b.V-a.V||(b.GP-b.GC)-(a.GP-a.GC)||b.GP-a.GP)}
function roundName(n){return{2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final'}[n]||'Mata-mata'}
function curPairs(){const R=S.tour;if(R.stage==='league')return R.rounds[R.ri];return R.ko.rounds[R.ko.cur].filter(p=>p[0]!=null&&p[1]!=null)}
function stageTitle(){const R=S.tour;if(R.stage==='league')return `Pontos corridos · Rodada ${R.ri+1}/${R.rounds.length}`;if(R.stage==='ko')return roundName(R.ko.rounds[R.ko.cur].length*2);return 'Fim de campeonato'}
function finishRound(ms){
 const R=S.tour;R.last={title:stageTitle(),ms};
 if(R.stage==='league'){
  ms.forEach(m=>{const h=R.table[m.h],a=R.table[m.a];h.J++;a.J++;h.GP+=m.gh;h.GC+=m.ga;a.GP+=m.ga;a.GC+=m.gh;
   if(m.gh>m.ga){h.V++;h.P+=3;a.D++}else if(m.gh<m.ga){a.V++;a.P+=3;h.D++}else{h.E++;a.E++;h.P++;a.P++}});
  R.ri++;
  if(R.ri>=R.rounds.length){if(S.cfg.format==='both'){const n=S.techs.length,k=n<=4?2:n<=8?4:8;initKO(standings().slice(0,k).map(r=>r.id))}else{R.stage='done';R.champ=standings()[0].id}}
 }else{
  const ko=R.ko,P=ko.rounds[ko.cur];
  const w=P.map(p=>p[0]==null?p[1]:p[1]==null?p[0]:winner(ms.find(m=>m.h===p[0]&&m.a===p[1])));
  ko.res[ko.cur]=ms;
  if(w.length===1){R.stage='done';R.champ=w[0]}else{const N=[];for(let i=0;i<w.length;i+=2)N.push([w[i],w[i+1]]);ko.rounds.push(N);ko.cur++}
 }
 if(R.stage==='done'){S.reveal=true;return renderEnd()}
 renderHub();
}
function playRound(){
 const ms=curPairs().map(([h,a])=>newMatch(h,a,S.tour.stage==='ko'));
 const mine=ms.find(m=>m.h===0||m.a===0);
 ms.filter(m=>m!==mine).forEach(simAll);
 if(mine)liveMatch(mine,ms);else finishRound(ms);
}
const nm=id=>esc(T(id).name), tn=id=>`${crest(T(id).crest,1)}${nm(id)}`;
const matchRow=m=>`<div class="match"><span>${tn(m.h)}</span><b style="white-space:nowrap">${scoreTxt(m)}</b><span>${nm(m.a)}${crest(T(m.a).crest,1)}</span></div>`;
function tableHTML(){return `<table><tr><th class="l">#</th><th class="l">Técnico</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${standings().map((r,i)=>`<tr class="${r.id===0?'me':''}"><td class="l">${i+1}</td><td class="l"><span class="row">${tn(r.id)}</span></td><td><b>${r.P}</b></td><td>${r.J}</td><td>${r.V}</td><td>${r.E}</td><td>${r.D}</td><td>${r.GP-r.GC}</td></tr>`).join('')}</table>`}
function koHTML(){const ko=S.tour.ko;if(!ko)return'';return ko.rounds.map((P,i)=>`<h3>${roundName(P.length*2)}</h3>${P.map(p=>{const m=(ko.res[i]||[]).find(m=>m.h===p[0]&&m.a===p[1]);
 if(p[0]==null||p[1]==null)return `<div class="match"><span>${tn(p[0]??p[1])}</span><span class="mut">passa direto</span></div>`;
 return m?matchRow(m):`<div class="match"><span>${tn(p[0])}</span><b>x</b><span>${nm(p[1])}${crest(T(p[1]).crest,1)}</span></div>`}).join('')}`).join('')}
function tacHTML(t,act){return `<div class="seg" style="margin-top:8px">${[['def','🛡️ Defensiva'],['equ','⚖️ Equilibrada'],['ofe','⚔️ Ofensiva']].map(([v,l])=>`<button class="${t.tac.post===v?'sel':''}" data-act="${act}" data-k="post" data-v="${v}">${l}</button>`).join('')}</div>
 <div class="seg" style="margin-top:6px">${[['equ','Normal'],['posse','Posse'],['pressao','Pressão'],['contra','Contra-ataque']].map(([v,l])=>`<button class="${t.tac.est===v?'sel':''}" data-act="${act}" data-k="est" data-v="${v}">${l}</button>`).join('')}</div>`}
function renderHub(){
 const R=S.tour,u=T(0),pairs=curPairs(),mine=pairs.find(p=>p.includes(0));
 const alive=R.stage!=='ko'||R.ko.rounds[R.ko.cur].some(p=>p.includes(0));
 app.innerHTML=`<header class="top"><div class="logo">${LOGO}Campeonato</div><span class="grow"></span><span class="tag">${S.cfg.mode==='br'?'Brasileiro':'Europeu'}</span></header><main class="wrap layout">
 <div>
  <div class="card"><h2>${stageTitle()}</h2>
  ${mine?`<p class="row" style="flex-wrap:wrap">Seu jogo: ${tn(mine[0])} <b>x</b> ${tn(mine[1])}</p>`:alive?`<p class="mut">Você passa direto nesta fase.</p>`:`<p class="mut">Você foi eliminado. Veja quem leva a taça.</p>`}
  <button class="btn ac block" data-act="play">${mine?'▶ Jogar partida':'⏩ Simular rodada'}</button></div>
  ${R.last?`<div class="card" style="margin-top:12px"><b>Resultados · ${R.last.title}</b>${R.last.ms.map(matchRow).join('')}</div>`:''}
  <div class="card" style="margin-top:12px">${R.ko?koHTML():''}${Object.keys(R.table).length?`<h3>Tabela</h3>${tableHTML()}`:''}</div>
 </div>
 <div class="card"><div class="row" style="margin-bottom:8px">${crest(u.crest,1)}<b class="grow">Seu time</b>${notaHTML(u)}</div>${pitchHTML(u,u.form)}<div style="margin-top:10px">${formsHTML(S.cfg.size,u.form,'formH')}</div>${tacHTML(u,'tacH')}
 <button class="btn block" data-act="squads2" style="margin-top:10px;font-size:14px">Ver todos os elencos</button></div>
 </main>`;
}
function renderEnd(){
 const R=S.tour,c=T(R.champ),u=T(0);
 app.innerHTML=`<header class="top"><div class="logo">${LOGO}Fim</div></header><main class="wrap">
 <div class="card" style="text-align:center">${TROPHY}<div style="transform:scale(2);margin:14px 0">${crest(c.crest)}</div><h1>${esc(c.name)}</h1><p class="mut">${c.isUser?'Você é o campeão! '+(S.cfg.budget>100?`(começando com R$ ${S.cfg.budget} contra R$ 100 dos bots 😅)`:'(com o mesmo dinheiro dos bots, mérito puro! 💪)'):'levou a taça.'}</p>
 <p>Você gastou <b>R$ ${u.spent}</b> no leilão.</p></div>
 ${R.last?`<div class="card" style="margin-top:12px"><b>${R.last.title}</b>${R.last.ms.map(matchRow).join('')}</div>`:''}
 <div class="card" style="margin-top:12px">${R.ko?koHTML():''}${Object.keys(R.table).length?`<h3>Tabela</h3>${tableHTML()}`:''}</div>
 <h3>Elencos (notas reveladas)</h3><div class="squads">${S.techs.map(squadCard).join('')}</div>
 <div class="grid2" style="margin:16px 0 30px"><button class="btn ac block" data-act="again">Jogar de novo</button><button class="btn block" data-act="home">Mudar configurações</button></div></main>`;
}

/* ================== PARTIDA AO VIVO ================== */
let LIVE=null;
function liveMatch(m,ms){
 LIVE={m,ms,speed:1,iv:null};const u=T(0);
 app.innerHTML=`<header class="top"><div class="logo">${LOGO}Ao vivo</div><span class="grow"></span><span class="tag">${stageTitle()}</span></header><main class="wrap layout">
 <div><div class="card"><div class="board">
  <div class="score"><div class="grow">${crest(T(m.h).crest)}<br>${nm(m.h)}</div><div class="n" id="gh">0</div><div class="mut">x</div><div class="n" id="ga">0</div><div class="grow">${crest(T(m.a).crest)}<br>${nm(m.a)}</div></div>
  <div style="text-align:center;margin-top:8px"><span class="tag" id="min">0'</span></div></div>
  <div class="seg" style="margin-top:12px">${[1,2,4].map(v=>`<button data-act="spd" data-v="${v}" class="${v===1?'sel':''}">${v}x</button>`).join('')}<button data-act="skip">Pular ⏭</button></div>
  <div id="evs" style="margin-top:10px"></div>
  <button class="btn ac block hide" id="cont" data-act="cont" style="margin-top:12px">Continuar</button>
 </div></div>
 <div class="card"><b>Mexa no time</b><div id="lp" style="margin-top:8px">${pitchHTML(u,u.form)}</div><div id="lf" style="margin-top:10px">${formsHTML(S.cfg.size,u.form,'formL')}</div><div id="lt">${tacHTML(u,'tacL')}</div></div>
 </main>`;
 runLive();
}
function runLive(){clearInterval(LIVE.iv);LIVE.iv=setInterval(()=>{const m=LIVE.m;if(over(m))return endLive();step(m);updLive()},260/LIVE.speed)}
function updLive(){
 const m=LIVE.m;$('#gh').textContent=m.gh;$('#ga').textContent=m.ga;
 $('#min').textContent=m.min>90?`${m.min}' prorrogação (gol de ouro)`:m.min+"'";
 $('#evs').innerHTML=[...m.ev].reverse().map(e=>`<div class="ev">⚽ <b>${e.min}'</b> ${esc(e.who)} <span class="mut">(${nm(e.side==='h'?m.h:m.a)})</span></div>`).join('')+(m.pens?`<div class="ev">🥅 Pênaltis: <b>${m.pens.h} x ${m.pens.a}</b></div>`:'');
}
function endLive(){
 clearInterval(LIVE.iv);const m=LIVE.m;updLive();
 const w=m.ko?winner(m):(m.gh>m.ga?m.h:m.ga>m.gh?m.a:null);
 $('#min').textContent='Fim de jogo'+(w===0?' · VITÓRIA!':w==null?' · empate':' · derrota');
 $('#cont').classList.remove('hide');
}

/* ================== AÇÕES ================== */
const ACT={
 set(b){const k=b.dataset.k;let v=b.dataset.v;if(k==='size'){v=+v;if(v!==S.cfg.size)S.cfg.form=FORMS[v][0][0]}if(k==='showOvr'||k==='fast')v=v==='true';S.cfg[k]=v;renderSetup()},
 club(b){S.cfg.club=b.dataset.v;renderSetup()},
 budget(b){S.cfg.budget=+b.dataset.v;renderSetup()},
 bots(b){S.cfg.nBots=Math.min(15,Math.max(1,S.cfg.nBots+ +b.dataset.v));renderSetup()},
 form0(b){S.cfg.form=b.dataset.v;renderSetup()},
 start(){start()},
 bid(b){userBid(b.dataset.v)},
 pass(){if(S.lot){S.lot.timer=Math.min(S.lot.timer,1.2);updLot()}},
 simrest(){simRest()},
 formA(b){const u=T(0);u.form=b.dataset.v;if(S.lot){S.lot.userOk=canTake(u,S.lot.p);renderAuction()}},
 tour(){initTour()},
 play(){playRound()},
 formH(b){T(0).form=b.dataset.v;renderHub()},
 tacH(b){T(0).tac[b.dataset.k]=b.dataset.v;renderHub()},
 squads2(){app.innerHTML=`<header class="top"><button class="btn" data-act="back">← Voltar</button></header><main class="wrap"><div class="squads">${S.techs.map(squadCard).join('')}</div></main>`},
 back(){renderHub()},
 spd(b){LIVE.speed=+b.dataset.v;document.querySelectorAll('[data-act=spd]').forEach(x=>x.classList.toggle('sel',x===b));runLive()},
 skip(){clearInterval(LIVE.iv);simAll(LIVE.m);endLive()},
 formL(b){const u=T(0);u.form=b.dataset.v;$('#lp').innerHTML=pitchHTML(u,u.form);$('#lf').innerHTML=formsHTML(S.cfg.size,u.form,'formL')},
 tacL(b){const u=T(0);u.tac[b.dataset.k]=b.dataset.v;$('#lt').innerHTML=tacHTML(u,'tacL')},
 cont(){finishRound(LIVE.ms)},
 again(){start()},
 home(){renderSetup()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b)});
document.addEventListener('input',e=>{if(e.target.id==='nm')S.cfg.name=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='bud'){S.cfg.budget=Math.min(1000,Math.max(100,Math.round(+e.target.value||100)));renderSetup()}});
renderSetup();
</script>
