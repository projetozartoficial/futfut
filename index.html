<style>
/* Leilão Infinito — paleta: verde gramado (#05060d / #1f9d55), ouro da nota (#9aa6ff), branco giz.
   Tipografia: Barlow Condensed (placar, números, títulos) + Barlow (texto). Layout mobile-first. */
:root{--bg:#000000;--bg2:#0b1440;--card:#0f1a52;--card2:#141f5e;--line:#2a3576;--tx:#eef0ff;--mut:#b4bbe0;--ac:#9aa6ff;--ac2:#6f7cf0;--gr:#2ecc71;--rd:#ff8a80;--r:16px;--sh:0 10px 30px #0007;--fd:"Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;min-height:100vh;
 background:radial-gradient(1200px 600px at 50% -200px,#191970 0,transparent 70%),repeating-linear-gradient(90deg,var(--bg) 0 90px,#03040a 90px 180px)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#000000d9;backdrop-filter:blur(10px);z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--fd);letter-spacing:.3px;text-transform:uppercase}
.logo svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 4px #0008)}
.logo em{font-style:normal;color:var(--ac)}
.grow{flex:1}
@media(max-width:640px){.top{position:static}.top .btn.sm{width:100%}}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px}
h1,h2,h3{font-family:var(--fd);letter-spacing:.2px;line-height:1.05}
h1{margin:6px 0 6px;font-size:clamp(34px,6vw,52px);text-wrap:balance}h2{margin:0 0 10px;font-size:26px}h3{margin:26px 0 10px;font-size:21px}
.mut{color:var(--mut)}.small{font-size:13px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:8px 0 4px}
.hero .note{width:min(260px,38vw);transform:rotate(-6deg);filter:drop-shadow(0 14px 22px #000a);animation:flt 5s ease-in-out infinite}
@keyframes flt{50%{transform:rotate(-3deg) translateY(-6px)}}
@media(max-width:560px){.hero{grid-template-columns:1fr}.hero .note{width:220px;margin:0 auto;order:-1}}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;transition:border-color .2s}
.input:focus{border-color:var(--ac);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.opt{text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:3px;min-height:72px}
.opt b{font:700 19px/1.1 var(--fd)}.opt span{color:var(--mut);font-size:13px;line-height:1.35}
.opt:hover{border-color:#4a55c9}
.opt.sel{border-color:var(--ac);background:linear-gradient(180deg,#1c2a7a,#121c5a);box-shadow:0 0 0 3px #9aa6ff22}.opt.sel b{color:var(--ac)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line)}
.forms button{background:none;border:0;border-radius:9px;padding:8px 2px;font:700 16px/1.1 var(--fd);color:var(--mut);display:flex;flex-direction:column;align-items:center;min-height:44px;justify-content:center}
.forms button:hover:not(:disabled){background:#ffffff0a;color:var(--tx)}
.forms button small{font:500 10px Barlow,sans-serif}.forms button.sel{background:#02030a;color:var(--gr);box-shadow:inset 0 0 0 1px #2ecc7155}.forms button:disabled{opacity:.22}
.count{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.count b{font:800 34px var(--fd);min-width:40px;text-align:center}
.cbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card2);font-size:22px}
.btn{border-radius:12px;padding:12px 16px;font:800 17px var(--fd);letter-spacing:.4px;text-transform:uppercase;background:var(--card2);border:1.5px solid var(--line);min-height:46px}
.btn:hover:not(:disabled){border-color:#6f7cf0}
.btn.ac{background:linear-gradient(180deg,#c3caff,var(--ac) 45%,var(--ac2));color:#05060d;border-color:#c9cfff;box-shadow:0 6px 18px #9aa6ff33}
.btn.ac:hover:not(:disabled){box-shadow:0 8px 26px #9aa6ff66}
.btn.block{width:100%;font-size:20px;padding:15px}.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:14px;min-height:38px}
.card{background:linear-gradient(180deg,#101a55,var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px}
footer.foot{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px 34px;border-top:1px solid #ffffff10;margin-top:20px}
/* escudo */
.crest{position:relative;display:inline-grid;place-items:center;width:32px;height:36px;flex:none;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:7px;box-shadow:inset 0 0 0 2px #0003}
.crest b{font:800 9px/1 var(--fd);color:#fff;background:#000b;padding:1px 3px;border-radius:3px;letter-spacing:.3px}
.crest:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff40,transparent 45%,#0003)}
.crest.sm{width:22px;height:25px;padding-bottom:5px}.crest.sm b{font-size:7px;padding:0 2px}
.crests{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.crests button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.crests button:hover{border-color:#4a55c9;color:var(--tx)}
.crests button.sel{border-color:var(--gr);background:#16236a;color:var(--tx);box-shadow:0 0 0 3px #2ecc7122}
.crests button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* campo */
.pitch{position:relative;width:100%;aspect-ratio:10/11;border-radius:14px;background:radial-gradient(circle at 50% 48%,transparent 13%,#ffffff26 13.4%,transparent 14%),linear-gradient(#ffffff26,#ffffff26) 0 48%/100% 2px no-repeat,repeating-linear-gradient(0deg,#1c8a4a 0 10%,#219552 10% 20%);border:2px solid #3cb36d;overflow:hidden;box-shadow:inset 0 0 40px #0004,0 8px 20px #0005}
.pitch:after{content:"";position:absolute;left:50%;bottom:0;width:38%;height:13%;border:2px solid #ffffff2a;border-bottom:0;transform:translateX(-50%)}
.pitch:before{content:"";position:absolute;left:50%;top:0;width:38%;height:9%;border:2px solid #ffffff2a;border-top:0;transform:translateX(-50%)}
.pitch.blue{background:radial-gradient(circle at 50% 48%,transparent 13%,#ffffff26 13.4%,transparent 14%),repeating-linear-gradient(0deg,#2f5fc4 0 10%,#3366cc 10% 20%);border-color:#5a86e0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:23%;z-index:2}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--fd);border:2px solid #fff;background:#0b1440;box-shadow:0 3px 6px #0007;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
.dot.empty{border:2px dashed #ffffffb0;background:#ffffff14;color:#fff;font-weight:400;font-size:20px;animation:none}
.slot i{font:700 11px/1.3 Barlow,sans-serif;font-style:normal;margin-top:3px;background:#02030acc;padding:1px 7px;border-radius:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i.bad{color:#ffb4a8}
.mini .dot{width:15px;height:15px;font-size:8px;border-width:1px;box-shadow:none}.mini .dot.empty{font-size:0;border-width:1px}
.mini .slot i{font-size:6px;padding:0 3px;margin-top:1px}
.mini{border-radius:8px;border-width:1px;box-shadow:none}.mini:before,.mini:after{border-width:1px}
.G{background:#5560d8!important;color:#111}.D{background:#2f6fd6!important}.M{background:#18914d!important}.A{background:#d64545!important}
.pos{display:inline-block;font:800 12px var(--fd);letter-spacing:.4px;padding:2px 7px;border-radius:6px}
/* leilão */
.auc{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.2fr);grid-template-areas:"me lot bots";max-width:1400px;margin:0 auto;padding:16px}
@media(max-width:1000px){.auc{grid-template-columns:1fr 1fr;grid-template-areas:"lot lot" "me bots"}}
@media(max-width:640px){.auc{grid-template-columns:1fr;grid-template-areas:"lot" "me" "bots"}}
.player{position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,#e3e6ff 0,#9aa6ff 35%,#5560d8 100%);color:#05060d;box-shadow:0 10px 24px #0008,inset 0 0 0 2px #fff6;overflow:hidden;animation:enter .4s ease-out}
.player:after{content:"";position:absolute;inset:-40% auto -40% -30%;width:30%;background:linear-gradient(90deg,transparent,#ffffff8c,transparent);transform:rotate(20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,60%{left:-30%}100%{left:130%}}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}}
.ovr{font:900 58px/1 var(--fd);min-width:66px;text-align:center}
.ovr small{display:block;font-size:12px;letter-spacing:1px;opacity:.7}
.pname{font:800 28px/1.02 var(--fd);text-wrap:balance}
.player .mut{color:#1c2470}
.price{font:900 52px/1 var(--fd);color:var(--ac);font-variant-numeric:tabular-nums}
.price.bump{animation:bump .3s}@keyframes bump{50%{transform:scale(1.15);color:#fff}}
.bar{height:10px;background:#0008;border-radius:6px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:linear-gradient(90deg,#27ae60,var(--gr));transition:width .35s linear}
.bar.low div{background:linear-gradient(90deg,#c0392b,var(--rd))}
.bids{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.bids .btn{padding:14px 2px;font-size:22px}
.log{max-height:140px;overflow:auto;font-size:14px;color:var(--mut);margin-top:10px}.log div{padding:4px 0;border-bottom:1px solid #ffffff0d}.log div:first-child{color:var(--tx);font-weight:600}
.bots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
@media(max-width:640px){.bots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bot{border-radius:12px;padding:6px;border:2px solid transparent;background:#ffffff06;transition:border-color .2s,background .2s}.bot.lead{border-color:var(--ac);background:#9aa6ff1a}
.bot .hd{display:flex;align-items:center;gap:5px;font:700 14px var(--fd);margin-bottom:5px}
.bot .hd b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function assign(players,slots){
 const n=slots.length,own=new Array(n).fill(-1);
 for(let i=0;i<players.length;i++){
  const seen=new Array(n).fill(false);
  const aug=k=>{const p=players[k];const ord=[...slots.keys()].filter(s=>p.ps.includes(slots[s].pos)).sort((a,b)=>p.ps.indexOf(slots[a].pos)-p.ps.indexOf(slots[b].pos));
   for(const s of ord){if(seen[s])continue;seen[s]=true;if(own[s]<0||aug(own[s])){own[s]=k;return true}}return false};
  if(!aug(i))return null;
 }
 return own.map(i=>i<0?null:players[i]);
}
const squadP=t=>t.squad.map(s=>s.p);
function lineup(t,form,strict){
 const sl=slotList(form).map(s=>({...s,p:null,eff:0}));if(!t||!t.squad.length)return sl;
 const pl=squadP(t),a=assign(pl,sl);
 if(a){sl.forEach((s,i)=>{if(a[i]){s.p=a[i];s.eff=a[i].ovr}});if(strict||t.squad.length>=sl.length||a.filter(Boolean).length===pl.length)return sl}
 if(strict)return sl;
 sl.forEach(s=>{s.p=null;s.eff=0});
 const pairs=[];pl.forEach(p=>sl.forEach((s,i)=>pairs.push({p,i,e:effOf(p,s),ex:p.ps.includes(s.pos)})));
 pairs.sort((a,b)=>(b.ex-a.ex)||(b.e-a.e));const used=new Set();
 pairs.forEach(x=>{if(used.has(x.p)||sl[x.i].p)return;used.add(x.p);sl[x.i].p=x.p;sl[x.i].eff=x.e});
 return sl;
}

/* ================== LEILÃO ================== */
const totFree=t=>slotList(t.form).length-t.squad.length;
const spendable=t=>t.money-(totFree(t)-1);
const canTake=(t,p)=>totFree(t)>0&&!!assign([...squadP(t),p],slotList(t.form));
const freePos=t=>{const sl=slotList(t.form),a=assign(squadP(t),sl)||[];return sl.filter((s,i)=>!a[i]).map(s=>s.pos)};
let TICK=null;

function start(){
 const c=S.cfg;clearInterval(TICK);
 const db=DB[c.mode];S.pool=shuffle(db.pl.map(p=>({...p})));
 const sorted=S.pool.map(p=>p.ovr).sort((a,b)=>a-b);
 S.pct=o=>{let k=0;while(k<sorted.length&&sorted[k]<o)k++;return k/(sorted.length-1)};
 S.reveal=false;S.unsold=[];S.lotN=0;S.gen=0;
 const mine=db.cl.find(x=>x.sig===c.club)||db.cl[0];
 const others=shuffle(db.cl.filter(x=>x!==mine)),names=shuffle([...COACH[c.mode]]);
 S.techs=[{id:0,name:c.name.trim()||'Você',isUser:true,money:c.budget,spent:0,form:c.form,squad:[],crest:mine,tac:{post:'equ',est:'equ'}}];
 for(let i=1;i<=c.nBots;i++)S.techs.push({id:i,name:names[i-1]+' Bot',isUser:false,money:100,spent:0,form:pick(BOT_FORMS[c.size]),squad:[],crest:others[i-1],pers:rnd(.8,1.25),tac:{post:'equ',est:'equ'}});
 S.totalSlots=S.techs.length*c.size;
 nextLot();
}
function generic(pos){S.gen++;return{id:'GEN'+S.gen,name:'Reserva '+S.gen,short:'Reserva',ps:[pos],pos,g:GOF[pos],ovr:ri(68,73),club:'Sem clube',sig:'---',color:'#555'}}
function drawLot(skipUser){
 const ts=S.techs.filter(t=>!(skipUser&&t.isUser)&&spendable(t)>=1&&totFree(t)>0);
 if(!ts.length)return null;
 const t=pick(ts),n=S.pool.length;
 // sorteia um jogador que caiba no time (mesmo que outro titular precise mudar de posição, ex.: Paquetá vai pro MC e Arrascaeta entra de MEI)
 for(let k=0;k<250&&n;k++){const i=ri(0,n-1),p=S.pool[i];if(canTake(t,p)){S.pool.splice(i,1);return p}}
 const cand=S.pool.filter(p=>canTake(t,p));
 if(cand.length){const p=pick(cand);S.pool.splice(S.pool.indexOf(p),1);return p}
 const un=S.unsold.filter(p=>canTake(t,p));
 if(un.length){const p=pick(un);S.unsold.splice(S.unsold.indexOf(p),1);return p}
 const fp=freePos(t);return generic(fp.length?pick(fp):'MC');
}
function botMax(t,p){
 if(spendable(t)<1||!canTake(t,p))return 0;
 const bps=100/S.cfg.size,pc=S.pct(p.ovr);
 let v=bps*(.35+3.4*pc**3);
 const urg=Math.min(2.2,Math.max(.6,(t.money/totFree(t))/bps));
 v*=t.pers*urg*rnd(.85,1.15);
 if(totFree(t)===1)v=spendable(t);
 return Math.max(1,Math.min(Math.round(v),spendable(t)));
}
function nextLot(){
 const p=drawLot(false);if(!p)return endAuction();
 S.lotN++;const L=S.lot={p,price:0,leader:null,timer:S.cfg.fast?6:10,start:S.cfg.fast?6:10,log:[],max:{},userOk:canTake(T(0),p)};
 S.techs.forEach(t=>{if(!t.isUser)L.max[t.id]=botMax(t,p)});

}
function placeBid(t,amount){const L=S.lot;L.price=amount;L.leader=t;L.log.unshift(`${t.name} deu ${brl(amount)}`);L.timer=Math.max(L.timer,S.cfg.fast?3:5)}
function tick(){
 const L=S.lot;if(!L)return;L.timer-=.35;
 if(L.timer<=0)return resolveLot();
 const c=S.techs.filter(t=>!t.isUser&&L.leader!==t&&L.max[t.id]>=L.price+1);
 if(c.length&&Math.random()<(L.timer<2.5?.75:.35)){const t=pick(c),room=L.max[t.id]-L.price;let inc=1;if(room>4&&Math.random()<.5)inc=ri(1,Math.max(1,Math.round(room*.35)));placeBid(t,L.price+inc)}
 updLot();
}
function bidAmt(k){const L=S.lot,u=T(0);let a=k==='max'?Math.min(spendable(u),Math.max(L.price+1,...Object.values(L.max).map(v=>v+1))):(L.leader?L.price:0)+ +k;if(a<=L.price)a=L.price+1;return a}
function userBid(k){
 const L=S.lot,u=T(0);if(!L||!L.userOk||L.leader===u)return;
 const amt=bidAmt(k);if(amt>spendable(u)){flash('Sem dinheiro pra esse lance',900);return}
 placeBid(u,amt);updLot();
}
function resolveLot(){
 clearInterval(TICK);const L=S.lot,p=L.p;let msg;
 if(L.leader){const t=L.leader;t.squad.push({p,price:L.price});t.money-=L.price;t.spent+=L.price;
  msg=t.isUser?`✅ ${esc(p.name)} é seu! (${brl(L.price)})`:`${esc(t.name)} levou ${esc(p.name)} por ${brl(L.price)}`}
 else{S.unsold.push(p);msg=`Ninguém quis ${esc(p.name)}`}
 S.lot=null;flash(msg,1100);setTimeout(nextLot,1150);
}
function flash(m,ms){const r=$('#res');r.innerHTML=m;r.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>r.style.display='none',ms)}
function instantResolve(p){
 const bids=S.techs.filter(t=>!t.isUser).map(t=>({t,m:botMax(t,p)})).filter(b=>b.m>0).sort((a,b)=>b.m-a.m);
 if(!bids.length){S.unsold.push(p);return}
 const w=bids[0],price=bids[1]?Math.min(w.m,bids[1].m+1):1;
 w.t.squad.push({p,price});w.t.money-=price;w.t.spent+=price;
}
function simRest(){
 clearInterval(TICK);if(S.lot){S.pool.push(S.lot.p);S.lot=null}

}
function endAuction(){

/* ================== MOTOR DE JOGO ================== */
const R0={},BASE={5:1.8/90,11:1.35/90};
function rawStr(sl){let atk=0,def=0,sum=0;sl.forEach(s=>{const e=s.p?s.eff:40;sum+=e;if(s.g==='G')def+=e*1.6;else if(s.g==='D'){def+=e;atk+=e*.1}else if(s.g==='M'){def+=e*.45;atk+=e*.45}else{atk+=e;def+=e*.1}});return{atk,def,avg:sum/sl.length}}
[5,11].forEach(n=>{const f=n===5?'2-1-1':'4-4-2';const r=rawStr(slotList(f).map(s=>({...s,p:1,eff:75})));R0[n]=r.atk/r.def});
function str(t,opp){
 const r=rawStr(lineup(t,t.form));const tc=t.tac;
 if(tc.post==='ofe'){r.atk*=1.15;r.def*=.86}if(tc.post==='def'){r.atk*=.82;r.def*=1.15}
 if(tc.est==='posse'){r.def*=1.06}if(tc.est==='pressao'){r.atk*=1.07;r.def*=.95}if(tc.est==='contra')r.atk*=opp.tac.post==='ofe'?1.12:.97;
 return r;
}
const lam=(a,b)=>BASE[S.cfg.size]*Math.pow((a.atk/b.def)/R0[S.cfg.size],1.3)*Math.exp((a.avg-b.avg)*.09);
function scorer(t){const sl=lineup(t,t.form).filter(s=>s.p&&s.g!=='G');const w=sl.map(s=>({D:.4,M:1.5,A:4}[s.g])*s.eff/70);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<sl.length;i++){r-=w[i];if(r<0)return sl[i].p.name}return sl[0]?sl[0].p.name:'?'}
function botTac(t,m,home){
 if(t.isUser)return;const gf=home?m.gh:m.ga,ga=home?m.ga:m.gh;
 if(m.min===0)t.tac={post:pick(['equ','equ','ofe','def']),est:pick(['equ','posse','pressao','contra'])};
 else if(m.min>=65&&gf<ga)t.tac.post='ofe';else if(m.min>=75&&gf>ga)t.tac.post='def';
}
function newMatch(h,a,ko){const m={h,a,gh:0,ga:0,min:0,ev:[],ko,pens:null};botTac(T(h),m,true);botTac(T(a),m,false);return m}
function step(m){
 const H=T(m.h),A=T(m.a);m.min++;botTac(H,m,true);botTac(A,m,false);
 const sh=str(H,A),sa=str(A,H);const lh=lam(sh,sa),la=lam(sa,sh);
 if(Math.random()<lh){m.gh++;m.ev.push({min:m.min,side:'h',who:scorer(H)})}
 if(!(m.min>90&&m.gh!==m.ga)&&Math.random()<la){m.ga++;m.ev.push({min:m.min,side:'a',who:scorer(A)})}
}
function over(m){if(m.min<90)return false;if(!m.ko||m.gh!==m.ga)return true;if(m.min>=120){if(!m.pens)m.pens=pens(m);return true}return false}
function pens(m){
 const H=T(m.h),A=T(m.a),gk=t=>lineup(t,t.form)[0].eff||50,tk=t=>lineup(t,t.form).filter(s=>s.g!=='G'&&s.p).sort((a,b)=>b.eff-a.eff);
 const th=tk(H),ta=tk(A),gh=gk(H),ga=gk(A),kick=(s,g)=>Math.random()<Math.min(.92,Math.max(.55,.75+(s.eff-g)/120));
 let ph=0,pa=0,i=0;for(;i<5;i++){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh)}
 while(ph===pa){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh);i++}
 return{h:ph,a:pa};
}
const winner=m=>m.gh>m.ga?m.h:m.ga>m.gh?m.a:(m.pens.h>m.pens.a?m.h:m.a);
function simAll(m){while(!over(m))step(m);return m}
const scoreTxt=m=>`${m.gh} x ${m.ga}${m.pens?` (pên. ${m.pens.h}x${m.pens.a})`:m.min>90?' (prorr.)':''}`;

function roundRobin(ids,double){let a=[...ids];if(a.length%2)a.push(null);const n=a.length,R=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i];if(h!=null&&w!=null)m.push(r%2?[w,h]:[h,w])}R.push(m);a=[a[0],a[n-1],...a.slice(1,n-1)]}
 if(double)R.push(...R.map(m=>m.map(([h,w])=>[w,h])));return R}
function bracketOrder(n){let o=[0,1];while(o.length<n){const m=o.length*2;o=o.flatMap(x=>[x,m-1-x])}return o}
function initKO(seeds){let size=2;while(size<seeds.length)size*=2;const arr=bracketOrder(size).map(i=>seeds[i]??null);const R=[];for(let i=0;i<size;i+=2)R.push([arr[i],arr[i+1]]);S.tour.ko={rounds:[R],res:[],cur:0};S.tour.stage='ko'}
function initTour(){
 const ids=S.techs.map(t=>t.id),f=S.cfg.format;S.tour={stage:'league',table:{},rounds:[],ri:0,last:null,ko:null};
 if(f==='ko')initKO(shuffle(ids));
 else{S.tour.rounds=roundRobin(shuffle(ids),f==='league'&&ids.length<=8);ids.forEach(id=>S.tour.table[id]={id,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0})}
 renderHub();
}
function standings(){return Object.values(S.tour.table).sort((a,b)=>b.P-a.P||b.V-a.V||(b.GP-b.GC)-(a.GP-a.GC)||b.GP-a.GP)}
function roundName(n){return{2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final'}[n]||'Mata-mata'}
function curPairs(){const R=S.tour;if(R.stage==='league')return R.rounds[R.ri];return R.ko.rounds[R.ko.cur].filter(p=>p[0]!=null&&p[1]!=null)}
function stageTitle(){const R=S.tour;if(R.stage==='league')return `Pontos corridos · Rodada ${R.ri+1}/${R.rounds.length}`;if(R.stage==='ko')return roundName(R.ko.rounds[R.ko.cur].length*2);return 'Fim de campeonato'}
function finishRound(ms){
 const R=S.tour;R.last={title:stageTitle(),ms};
 if(R.stage==='league'){
  ms.forEach(m=>{const h=R.table[m.h],a=R.table[m.a];h.J++;a.J++;h.GP+=m.gh;h.GC+=m.ga;a.GP+=m.ga;a.GC+=m.gh;
   if(m.gh>m.ga){h.V++;h.P+=3;a.D++}else if(m.gh<m.ga){a.V++;a.P+=3;h.D++}else{h.E++;a.E++;h.P++;a.P++}});
  R.ri++;
  if(R.ri>=R.rounds.length){if(S.cfg.format==='both'){const n=S.techs.length,k=n<=4?2:n<=8?4:8;initKO(standings().slice(0,k).map(r=>r.id))}else{R.stage='done';R.champ=standings()[0].id}}
 }else{
  const ko=R.ko,P=ko.rounds[ko.cur];
  const w=P.map(p=>p[0]==null?p[1]:p[1]==null?p[0]:winner(ms.find(m=>m.h===p[0]&&m.a===p[1])));
  ko.res[ko.cur]=ms;
  if(w.length===1){R.stage='done';R.champ=w[0]}else{const N=[];for(let i=0;i<w.length;i+=2)N.push([w[i],w[i+1]]);ko.rounds.push(N);ko.cur++}
 }
 if(R.stage==='done'){S.reveal=true;return renderEnd()}
 renderHub();
}
function playRound(){
 const ms=curPairs().map(([h,a])=>newMatch(h,a,S.tour.stage==='ko'));
 const mine=ms.find(m=>m.h===0||m.a===0);
 ms.filter(m=>m!==mine).forEach(simAll);
 if(mine)liveMatch(mine,ms);else finishRound(ms);
}
const nm=id=>esc(T(id).name), tn=id=>`${crest(T(id).crest,1)}${nm(id)}`;
const matchRow=m=>`<div class="match"><span>${tn(m.h)}</span><b style="white-space:nowrap">${scoreTxt(m)}</b><span>${nm(m.a)}${crest(T(m.a).crest,1)}</span></div>`;
function tableHTML(){return `<table><tr><th class="l">#</th><th class="l">Técnico</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${standings().map((r,i)=>`<tr class="${r.id===0?'me':''}"><td class="l">${i+1}</td><td class="l"><span class="row">${tn(r.id)}</span></td><td><b>${r.P}</b></td><td>${r.J}</td><td>${r.V}</td><td>${r.E}</td><td>${r.D}</td><td>${r.GP-r.GC}</td></tr>`).join('')}</table>`}
function koHTML(){const ko=S.tour.ko;if(!ko)return'';return ko.rounds.map((P,i)=>`<h3>${roundName(P.length*2)}</h3>${P.map(p=>{const m=(ko.res[i]||[]).find(m=>m.h===p[0]&&m.a===p[1]);

function tacHTML(t,act){return `<div class="seg" style="margin-top:8px">${[['def','🛡️ Defensiva'],['equ','⚖️ Equilibrada'],['ofe','⚔️ Ofensiva']].map(([v,l])=>`<button class="${t.tac.post===v?'sel':''}" data-act="${act}" data-k="post" data-v="${v}">${l}</button>`).join('')}</div>
 <div class="seg" style="margin-top:6px">${[['equ','Normal'],['posse','Posse'],['pressao','Pressão'],['contra','Contra-ataque']].map(([v,l])=>`<button class="${t.tac.est===v?'sel':''}" data-act="${act}" data-k="est" data-v="${v}">${l}</button>`).join('')}</div>`}
function renderHub(){

function placeXI(players,form){

 players.forEach(p=>sl.forEach((s,i)=>pairs.push({p,i,e:effC(p,s),ex:p.ps.includes(s.pos)})));

 pairs.forEach(x=>{if(used.has(x.p.i)||xi[x.i]!=null)return;used.add(x.p.i);xi[x.i]=x.p.i});
 return xi;
}
function autoXI(ci,form){

const cLam=(a,b)=>(1.3/90)*Math.pow((a.atk/b.def)/R0[11],1.3)*Math.exp((a.avg-b.avg)*.09);
function cScorer(ci){const sl=lineupC(ci).filter(s=>s.p&&s.g!=='G');const w=sl.map(s=>({D:.4,M:1.5,A:4}[s.g])*s.eff/70);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<sl.length;i++){r-=w[i];if(r<0)return sl[i].p}return sl[0]?sl[0].p:null}
function botTacC(ci,m,home){
 if(ci===C.me)return;const c=CL(ci),gf=home?m.gh:m.ga,ga=home?m.ga:m.gh;
 if(m.min===0)c.tac={post:pick(['equ','equ','ofe','def']),est:pick(['equ','posse','pressao','contra'])};
 else if(m.min>=65&&gf+(home?m.ah:m.aa)<ga+(home?m.aa:m.ah))c.tac.post='ofe';else if(m.min>=75&&gf+(home?m.ah:m.aa)>ga+(home?m.aa:m.ah))c.tac.post='def';
}
function cPens(m){
 const gk=ci=>lineupC(ci)[0].eff||50,tk=ci=>lineupC(ci).filter(s=>s.g!=='G'&&s.p).sort((a,b)=>b.eff-a.eff);
 const th=tk(m.h),ta=tk(m.a),gh=gk(m.h),ga=gk(m.a),kick=(s,g)=>s&&Math.random()<Math.min(.92,Math.max(.55,.75+(s.eff-g)/120));
 let ph=0,pa=0,i=0;for(;i<5;i++){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh)}
 while(ph===pa&&i<30){ph+=kick(th[i%th.length],ga);pa+=kick(ta[i%ta.length],gh);i++}if(ph===pa)ph++;
 return{h:ph,a:pa};
}
// m: {h,a,gh,ga,min,ev:[],ko,ah,aa(agregado prévio),pens,et}
function newM(h,a,ko,ah,aa){return{h,a,gh:0,ga:0,min:0,ev:[],ko:!!ko,ah:ah||0,aa:aa||0,pens:null,et:false}}
function mStep(m){
 m.min++;botTacC(m.h,m,true);botTacC(m.a,m,false);
 const sh=cStr(m.h,m.a),sa=cStr(m.a,m.h);const lh=cLam(sh,sa)*1.1,la=cLam(sa,sh)*.92;
 if(Math.random()<lh){const p=cScorer(m.h);m.gh++;m.ev.push({min:m.min,side:'h',pid:p?p.i:null})}
 if(Math.random()<la){const p=cScorer(m.a);m.ga++;m.ev.push({min:m.min,side:'a',pid:p?p.i:null})}
}
function mOver(m){
 if(m.min<90)return false;const th=m.gh+m.ah,ta=m.ga+m.aa;
 if(!m.ko||th!==ta)return true;
 if(m.min<120){m.et=true;return false}
 if(!m.pens)m.pens=cPens(m);return true;
}
function quickSim(m){
 botTacC(m.h,m,true);botTacC(m.a,m,false);
 const sh=cStr(m.h,m.a),sa=cStr(m.a,m.h);const lh=cLam(sh,sa)*1.1*90,la=cLam(sa,sh)*.92*90;
 const add=(side,ci,n,a,b)=>{for(let k=0;k<n;k++){const p=cScorer(ci);m.ev.push({min:ri(a,b),side,pid:p?p.i:null})}};
 const gh=poi(lh),ga=poi(la);m.gh=gh;m.ga=ga;add('h',m.h,gh,1,90);add('a',m.a,ga,1,90);m.min=90;
 if(m.ko&&m.gh+m.ah===m.ga+m.aa){m.et=true;const eh=poi(lh/3),ea=poi(la/3);m.gh+=eh;m.ga+=ea;add('h',m.h,eh,91,120);add('a',m.a,ea,91,120);m.min=120;if(m.gh+m.ah===m.ga+m.aa)m.pens=cPens(m)}
 m.ev.sort((x,y)=>x.min-y.min);return m;
}
const mWin=m=>{const th=m.gh+m.ah,ta=m.ga+m.aa;return th>ta?m.h:ta>th?m.a:(m.pens?(m.pens.h>m.pens.a?m.h:m.a):null)};
const mTxt=m=>`${m.gh} x ${m.ga}${m.pens?` (pên. ${m.pens.h}x${m.pens.a})`:m.et?' (prorr.)':''}`;

function mkLeague(key){
 const teams=C.clubs.filter(c=>c.lg===key).map(c=>c.i);
 const tab={};teams.forEach(i=>tab[i]={id:i,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0});
 return{t:'L',key,name:LG[key].n,teams,rounds:roundRobin(shuffle([...teams]),true),ri:0,tab,last:null,champ:null};
}
const sortTab=tab=>Object.values(tab).sort((a,b)=>b.P-a.P||b.V-a.V||(b.GP-b.GC)-(a.GP-a.GC)||b.GP-a.GP||a.id-b.id);
function applyTab(tab,m){const h=tab[m.h],a=tab[m.a];if(!h||!a)return;h.J++;a.J++;h.GP+=m.gh;h.GC+=m.ga;a.GP+=m.ga;a.GC+=m.gh;
 if(m.gh>m.ga){h.V++;h.P+=3;a.D++}else if(m.gh<m.ga){a.V++;a.P+=3;h.D++}else{h.E++;a.E++;h.P++;a.P++}}
const stageName=n=>({2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final',32:'1ª fase'}[n]||'Fase');
function mkCup(key){
 const teams=C.clubs.filter(c=>c.lg===key).map(c=>c.i).sort((a,b)=>CL(b).pw-CL(a).pw);
 let size=2;while(size<teams.length)size*=2;
 const arr=bracketOrder(size).map(i=>teams[i]??null);const ties=[];
 for(let i=0;i<size;i+=2){const x=arr[i],y=arr[i+1];
  if(x==null||y==null)ties.push({a:x??y,b:null,legs:1,m:[],w:x??y});
  else{const f=Math.random()<.5;ties.push({a:f?x:y,b:f?y:x,legs:1,m:[],w:null})}}
 return{t:'K',key:key+'c',name:LG[key].cup,teams,stages:[{nm:stageName(size),ties}],cur:0,champ:null,nSt:Math.log2(size)};
}
function nextStageFrom(st,legs,nm){const w=st.ties.map(t=>t.w);const ties=[];for(let i=0;i<w.length;i+=2){const x=w[i],y=w[i+1];const f=Math.random()<.5;ties.push({a:f?x:y,b:f?y:x,legs,m:[],w:null})}return{nm:nm||stageName(w.length),ties}}

// Champions: sorteio com restrições
function uclDraw(teams,holder){
 const ord=[...teams].sort((a,b)=>(b===holder)-(a===holder)||CL(b).pw-CL(a).pw);
 const pots=[0,1,2,3].map(k=>ord.slice(k*9,k*9+9));const ct=i=>CL(i).ctry;
 for(let mode=0;mode<3;mode++){
  for(let tries=0;tries<400;tries++){
   const opp=new Map(teams.map(t=>[t,[]]));const edges=[];let ok=true;
   const can=(x,y)=>x!==y&&(mode===2||ct(x)!==ct(y))&&!opp.get(x).includes(y)&&(mode>=1||(opp.get(x).filter(z=>ct(z)===ct(y)).length<2&&opp.get(y).filter(z=>ct(z)===ct(x)).length<2));
   const link=(h,a)=>{edges.push([h,a]);opp.get(h).push(a);opp.get(a).push(h)};
   const perm=(A,B,self)=>{for(let t=0;t<60;t++){const used=new Set(),res=[];let good=true;
     for(const x of shuffle([...A.keys()])){const cand=shuffle([...B]).filter(y=>!used.has(y)&&can(A[x],y)&&!(self&&res.some(([u,v])=>u===y&&v===A[x])));if(!cand.length){good=false;break}used.add(cand[0]);res.push([A[x],cand[0]])}
     if(good)return res}return null};
   for(let i=0;i<4&&ok;i++){
    const s=perm(pots[i],pots[i],true);if(!s){ok=false;break}s.forEach(([h,a])=>link(h,a));
    for(let j=i+1;j<4&&ok;j++){const p1=perm(pots[i],pots[j]);if(!p1){ok=false;break}p1.forEach(([h,a])=>link(h,a));const p2=perm(pots[j],pots[i]);if(!p2){ok=false;break}p2.forEach(([h,a])=>link(h,a))}
   }
   if(ok&&teams.every(t=>opp.get(t).length===8))return{edges,pots};
  }
 }
 // fallback: rodízio simples
 const edges=[];const R=roundRobin(shuffle([...teams]),false).slice(0,8);R.forEach(r=>r.forEach(e=>edges.push(e)));return{edges,pots};
}
function spreadMD(edges,teams,nd){
 let best=null,bo=1e9;
 for(let t=0;t<120;t++){const days=[...Array(nd)].map(()=>[]),busy=[...Array(nd)].map(()=>new Set());let ov=0;
  shuffle([...edges]).forEach(e=>{let d=[...Array(nd).keys()].find(k=>!busy[k].has(e[0])&&!busy[k].has(e[1]));if(d==null){ov++;d=[...Array(nd).keys()].sort((x,y)=>days[x].length-days[y].length)[0]}days[d].push(e);busy[d].add(e[0]);busy[d].add(e[1])});
  if(ov<bo){bo=ov;best=days}if(!ov)break}
 return best;
}
function mkUCL(teams,holder){
 const {edges}=uclDraw(teams,holder);const fx=spreadMD(edges,teams,8);
 const tab={};teams.forEach(i=>tab[i]={id:i,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0});
 return{t:'U',key:'UCL',name:'Champions',teams,fx,md:0,tab,stages:[],cur:-1,champ:null,last:null,out:[]};
}
function mkLIB(teams){
 const ord=[...teams].sort((a,b)=>CL(a).pw-CL(b).pw);const w=ord.slice(0,4);
 return{t:'B',key:'LIB',name:'Libertadores',teams,pre:{nm:'Fase preliminar',ties:[{a:w[0],b:w[3],legs:2,m:[],w:null},{a:w[1],b:w[2],legs:2,m:[],w:null}]},groups:null,gfx:null,gr:0,stages:[],cur:-1,champ:null,last:null};
}
function libGroups(L){
 const out=new Set();L.pre.ties.forEach(t=>out.add(t.w===t.a?t.b:t.a));
 const t32=L.teams.filter(i=>!out.has(i)).sort((a,b)=>CL(b).pw-CL(a).pw);const pots=[0,1,2,3].map(k=>t32.slice(k*8,k*8+8));
 let G=null;
 for(let tries=0;tries<300&&!G;tries++){const g=[...Array(8)].map(()=>[]);let ok=true;
  for(const pot of pots){const order=shuffle([...pot]);const free=new Set([...Array(8).keys()]);
   for(const t of order){const opts=shuffle([...free]).filter(k=>tries>200||!g[k].some(x=>CL(x).ctry===CL(t).ctry));if(!opts.length){ok=false;break}g[opts[0]].push(t);free.delete(opts[0])}
   if(!ok)break}
  if(ok)G=g}
 L.groups=G.map((g,k)=>({nm:'Grupo '+'ABCDEFGH'[k],teams:g,tab:Object.fromEntries(g.map(i=>[i,{id:i,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0}])),rounds:roundRobin(g,true)}));
}

function libStage(L,st){
 const order=['r16','qf','sf','fin'],nm={r16:'Oitavas de final',qf:'Quartas de final',sf:'Semifinal',fin:'Final'};const idx=order.indexOf(st);
 if(L.cur>=idx)return L.stages[idx];
 if(idx===0){const G=L.groups.map(g=>sortTab(g.tab).map(r=>r.id));const ties=[];
  for(let k=0;k<8;k+=2){ties.push({a:G[k+1][1],b:G[k][0],legs:2,m:[],w:null});ties.push({a:G[k][1],b:G[k+1][0],legs:2,m:[],w:null})}
  L.stages.push({nm:nm.r16,ties})}
 else L.stages.push(nextStageFrom(L.stages[idx-1],st==='fin'?1:2,nm[st]));
 L.cur=idx;return L.stages[idx];
}
function uclStage(U,st){
 const order=['po','r16','qf','sf','fin'],nm={po:'Playoff',r16:'Oitavas de final',qf:'Quartas de final',sf:'Semifinal',fin:'Final'};const idx=order.indexOf(st);
 if(U.cur>=idx)return U.stages[idx];
 if(idx===0){const t=sortTab(U.tab).map(r=>r.id);U.rank=t;const ties=[];for(let k=0;k<8;k++)ties.push({a:t[23-k],b:t[8+k],legs:2,m:[],w:null});U.stages.push({nm:nm.po,ties});U.out=t.slice(24)}
 else if(idx===1){const t=U.rank,po=U.stages[0].ties;const seeds=[0,7,3,4,1,6,2,5];const ties=seeds.map(k=>({a:po[7-k].w,b:t[k],legs:2,m:[],w:null}));U.stages.push({nm:nm.r16,ties})}
 else U.stages.push(nextStageFrom(U.stages[idx-1],st==='fin'?1:2,nm[st]));
 U.cur=idx;return U.stages[idx];
}
function tieFx(t,leg,comp){
 if(t.b==null||t.w!=null&&leg!==2)return null;
 if(t.legs===1)return{comp,tie:t,h:t.a,a:t.b,ko:true,ah:0,aa:0};
 if(leg===1)return{comp,tie:t,h:t.a,a:t.b,ko:false,ah:0,aa:0};
 const m1=t.m[0];if(!m1)return null;return{comp,tie:t,h:t.b,a:t.a,ko:true,ah:m1.ga,aa:m1.gh};
}
function dayFixtures(ev){
 const F=[];const X=C.comps;
 if(ev.k==='lg'){
  LGORD.forEach(k=>{const L=X.L[k],R=L.rounds.length,target=Math.floor((ev.r+1)*R/38);while(L.ri<target){L.rounds[L.ri].forEach(([h,a])=>F.push({comp:L,h,a,ko:false,ah:0,aa:0,lr:L.ri}));L.ri++}});
 }else if(ev.k==='cup'){
  LGORD.forEach(k=>{const K=X.CU[k];const s=ev.st-(5-K.nSt);if(s<0)return;if(s>K.cur){K.stages.push(nextStageFrom(K.stages[K.cur],1));K.cur=s}
   K.stages[s].ties.forEach(t=>{if(t.w==null){const f=tieFx(t,1,K);if(f)F.push(f)}})});
 }else if(ev.k==='ucl'){
  const U=X.UCL;if(ev.st==='lg'){(U.fx[ev.md]||[]).forEach(([h,a])=>F.push({comp:U,h,a,ko:false,ah:0,aa:0}));U.md=ev.md+1}
  else{const s=uclStage(U,ev.st);s.ties.forEach(t=>{const f=tieFx(t,ev.leg,U);if(f)F.push(f)})}
 }else if(ev.k==='lib'){
  const B=X.LIB;
  if(ev.st==='pre')B.pre.ties.forEach(t=>{const f=tieFx(t,ev.leg,B);if(f)F.push(f)});
  else if(ev.st==='grp'){if(!B.groups)libGroups(B);B.groups.forEach(g=>(g.rounds[ev.md]||[]).forEach(([h,a])=>F.push({comp:B,grp:g,h,a,ko:false,ah:0,aa:0})));B.gr=ev.md+1}
  else{const s=libStage(B,ev.st);s.ties.forEach(t=>{const f=tieFx(t,ev.leg,B);if(f)F.push(f)})}
 }else if(ev.k==='mun'){
  const a=X.UCL.champ,b=X.LIB.champ;if(a!=null&&b!=null){X.MUN={t:'M',name:'Mundial de Clubes',a,b,m:null,champ:null};F.push({comp:X.MUN,h:a,a:b,ko:true,ah:0,aa:0,mun:true})}
 }
 return F;
}

 if(ev.k==='ucl'){const nm={lg:'Fase de liga',po:'Playoff',r16:'Oitavas',qf:'Quartas',sf:'Semifinal',fin:'Final'}[ev.st];return `Champions · ${nm}${ev.st==='lg'?` · ${ev.md+1}ª rodada`:ev.st==='fin'?'':` · ${ev.leg===1?'ida':'volta'}`}`}
 if(ev.k==='lib'){const nm={pre:'Fase preliminar',grp:'Fase de grupos',r16:'Oitavas',qf:'Quartas',sf:'Semifinal',fin:'Final'}[ev.st];return `Libertadores · ${nm}${ev.st==='grp'?` · ${ev.md+1}ª rodada`:ev.st==='fin'?'':` · ${ev.leg===1?'ida':'volta'}`}`}
 if(ev.k==='mun')return 'Mundial de Clubes · Final';

}

/* ---------- aplicar resultado ---------- */
function applyRes(f,m){
 const comp=f.comp;
 // estatísticas
 [m.h,m.a].forEach(ci=>xiOf(ci).forEach(id=>{if(id!=null)PL(id).ap++}));
 m.ev.forEach(e=>{if(e.pid==null)return;const p=PL(e.pid);p.ga++;if(comp.t==='L')p.gl++});
 if(comp.t==='L'){applyTab(comp.tab,m);(comp._day=comp._day||[]).push(m)}
 else if(comp.t==='U'&&!f.tie){applyTab(comp.tab,m);prizeUCL(m)}
 else if(comp.t==='B'&&f.grp){applyTab(f.grp.tab,m);prizeLIB(m)}

 if(m.h===C.me||m.a===C.me)C.myRes.unshift({t:evTitle(C.cal[C.day]),h:m.h,a:m.a,s:mTxt(m),agg:f.ah||f.aa?`agregado ${m.gh+m.ah} x ${m.ga+m.aa}`:''});
}

function prizeLIB(m){[[m.h,m.gh,m.ga],[m.a,m.ga,m.gh]].forEach(([ci,f,a])=>addMoney(ci,f>a?.35:f===a?.12:0,'pri'))}

function afterDay(ev){

 }
 if(ev.k==='cup'){LGORD.forEach(k=>{const K=X.CU[k];const s=K.stages[K.cur];if(s&&K.cur===K.nSt-1&&s.ties.every(t=>t.w!=null)&&K.champ==null){K.champ=s.ties[0].w;const ru=s.ties[0].a===K.champ?s.ties[0].b:s.ties[0].a;addMoney(K.champ,r1(LG[k].prize*.15),'pri');addMoney(ru,r1(LG[k].prize*.07),'pri');pushNews(`🏆 ${esc(CL(K.champ).club)} conquista a ${K.name}!`);if(K.champ===C.me)addTroph(K.name)}})}
 if(ev.k==='ucl'&&ev.st==='lg'&&ev.md===7){const t=sortTab(X.UCL.tab);t.slice(0,24).forEach(r=>addMoney(r.id,1,'pri'))}
 if(ev.k==='ucl'&&ev.st!=='lg'){const U=X.UCL,s=U.stages[U.cur];if(s&&s.ties.every(t=>t.w!=null)){const bonus={po:0,r16:11,qf:12.5,sf:15,fin:18.5}[ev.st];
  if(ev.st!=='fin'&&(ev.leg===2))s.ties.forEach(t=>addMoney(t.w,{po:11,r16:12.5,qf:15,sf:18.5}[ev.st],'pri'));
  if(ev.st==='fin'){U.champ=s.ties[0].w;addMoney(U.champ,6+18.5,'pri');pushNews(`🏆 ${esc(CL(U.champ).club)} é campeão da Champions!`);if(U.champ===C.me)addTroph('Champions')}}}
 if(ev.k==='lib'&&ev.st!=='pre'&&ev.st!=='grp'){const B=X.LIB,s=B.stages[B.cur];if(s&&s.ties.every(t=>t.w!=null)){
  if(ev.st!=='fin'&&ev.leg===2)s.ties.forEach(t=>addMoney(t.w,{r16:1.7,qf:2.3,sf:7}[ev.st],'pri'));
  if(ev.st==='fin'){B.champ=s.ties[0].w;addMoney(B.champ,16,'pri');pushNews(`🏆 ${esc(CL(B.champ).club)} é campeão da Libertadores!`);if(B.champ===C.me)addTroph('Libertadores')}}}
 if(ev.k==='lib'&&ev.st==='grp'&&ev.md===5){X.LIB.groups.forEach(g=>sortTab(g.tab).slice(0,2).forEach(r=>addMoney(r.id,1.25,'pri')))}
 if(ev.k==='mun'&&X.MUN&&X.MUN.champ!=null){const w=X.MUN.champ,l=w===X.MUN.a?X.MUN.b:X.MUN.a;addMoney(w,30,'pri');addMoney(l,15,'pri');pushNews(`🌍 ${esc(CL(w).club)} é campeão do Mundial de Clubes!`);if(w===C.me)addTroph('Mundial de Clubes')}

/* ---------- janelas de transferência ---------- */
function openWindow(n){
 C.win={n,moves:0,target:ri(15,30),open:true,log:[]};C.winIdx++;if(n===2)C.half=2;C.negs={};
 calcPower();calcPrestige();
 botMarket(Math.floor(C.win.target/2));
 genOffers(ri(1,3));
 C.day++;PEND=null;cSave();
}
function closeWindow(){
 calcPower();calcPrestige();botMarket(Math.max(0,C.win.target-C.win.moves));
 C.clubs.forEach(c=>fillSquad(c.i));calcPower();calcPrestige();
 pushNews(`🔒 Janela fechada: ${C.win.moves} transferências entre os clubes.`);
 C.win=null;C.offers=[];cSave();
}
function inXI(p){return p.c>=0&&xiOf(p.c).includes(p.i)}
function isKey(p){if(p.c<0)return false;const c=CL(p.c);return inXI(p)&&p.o>=c.pw}
function needOf(ci){
 const c=CL(ci),pl=sq(ci),lu=lineupC(ci);const res=[];
 Object.keys(TMIN).forEach(t=>{const cnt=pl.filter(p=>typesOf(p).includes(t)).length;const st=lu.filter(s=>TYP[s.pos]===t);const cur=st.length?Math.min(...st.map(s=>s.eff)):(cnt?Math.max(...pl.filter(p=>typesOf(p).includes(t)).map(p=>p.o)):60);
  let sc=0;if(cnt<TMIN[t])sc+=10;if(st.length&&cur<c.pw-3)sc+=c.pw-cur;if(sc>0)res.push({t,cur,sc})});
 res.sort((a,b)=>b.sc-a.sc);return res[0]||null;
}
function playerWilling(p,buyer){
 if(p.c<0)return buyer.pr>=p.lp-3;
 const s=CL(p.c);const starter=inXI(p);
 if(p.o>=88&&buyer.pr<s.pr)return false;
 if(starter&&buyer.pr<s.pr-1)return false;
 if(!starter&&buyer.pr<s.pr-3)return false;
 if(p.o>buyer.pw+8)return false; // seria craque deslocado demais
 return true;
}
function sellerWilling(p,buyer){if(p.c<0)return true;const s=CL(p.c);if(isKey(p)&&buyer.pr<s.pr)return false;return true}
function botFee(p){if(p.c<0)return 0;let f=p.v*(isKey(p)?1.3:inXI(p)?1.12:.95)*rnd(.95,1.1);if(p.ct===1)f*=.65;return r1(f)}
function findTarget(c,need){
 let best=null,bs=-1e9;
 for(const p of C.P){
  if(p.c===c.i||p.c===C.me||p.ln||p.pre!=null||p.lk>C.winIdx)continue;
  if(!p.ps.some(x=>TYP[x]===need.t))continue;
  if(p.o<need.cur+2||p.o>c.pw+5)continue;
  if(!sellerWilling(p,c)||!playerWilling(p,c))continue;
  const fee=botFee(p);if(fee>c.money*.7||fee>c.cap)continue;
  const sc=p.o*10-fee*.05+Math.random()*6;if(sc>bs){bs=sc;best={p,fee}}
 }
 return best;
}
function botMarket(maxMoves){
 const cap=new Map();let moves=0;const bots=C.clubs.filter(c=>c.i!==C.me);
 bots.forEach(c=>{c.cap=Math.max(3,1.8*Math.max(...sq(c.i).map(p=>p.v)))});
 bots.forEach(c=>cap.set(c.i,ri(2,3)));
 for(let pass=0;pass<4&&moves<maxMoves;pass++){
  const bids=new Map();
  shuffle([...bots]).forEach(c=>{if(cap.get(c.i)<=0)return;const need=needOf(c.i);if(!need)return;const t=findTarget(c,need);if(!t)return;
   const w=r2(Math.max(t.p.w*1.1,baseWage(t.p.o,c.i))*rnd(1,1.15));(bids.get(t.p.i)||bids.set(t.p.i,[]).get(t.p.i)).push({c,fee:t.fee,w})});
  for(const [pid,arr] of bids){if(moves>=maxMoves)break;arr.sort((x,y)=>y.c.pr-x.c.pr||y.w-x.w);const b=arr[0],p=PL(pid);if(cap.get(b.c.i)<=0||p.c===b.c.i)continue;
   doTransfer(p,b.c.i,b.fee,b.w,ri(2,5),arr.length>1?`(${arr.length} clubes interessados)`:'');cap.set(b.c.i,cap.get(b.c.i)-1);moves++}
 }
 if(C.win)C.win.moves+=moves;
 return moves;
}
function doTransfer(p,to,fee,wage,yrs,note,kind){
 const from=p.c;
 if(from>=0){addMoney(from,fee);CL(from).ver++;const fc=CL(from);if(fc.man)fc.man=null}
 addMoney(to,-fee);CL(to).ver++;
 if(from===C.me&&C.fin)C.fin.tout=r1(C.fin.tout+fee);if(to===C.me&&C.fin)C.fin.tin=r1(C.fin.tin+fee);
 p.lp=from>=0?CL(from).pr:p.lp;p.c=to;p.w=r2(wage);p.ct=yrs;p.lk=C.winIdx+2;revalue(p);
 const fn=from>=0?CL(from).club:'sem clube';
 const txt=kind==='loan'?`🔁 ${esc(p.n)} (${p.o}) vai por empréstimo do ${esc(fn)} para o ${esc(CL(to).club)}${fee?` · ${M(fee)}`:''}`:
  `💱 ${esc(p.n)} (${p.o}) · ${esc(fn)} → ${esc(CL(to).club)} · ${fee?M(fee):'de graça'} ${note||''}`;
 pushNews(txt);
 if(kind!=='loan')checkRecord(p,fn,CL(to).club,fee,to);
}
function checkRecord(p,f,t,fee,to){
 if(fee>=C.recs[C.recs.length-1].fee||C.recs.length<12){C.recs.push({n:p.n,f,t,fee:r1(fee),y:'T'+C.season,mine:to===C.me});C.recs.sort((a,b)=>b.fee-a.fee);C.recs=C.recs.slice(0,15);
  if(C.recs[0].y==='T'+C.season&&C.recs[0].n===p.n)pushNews(`🚨 RECORDE MUNDIAL! ${esc(p.n)} por ${M(fee)}.`)}
 if(CL(to).ctry==='BRA'&&fee>C.brRec.fee){C.brRec={n:p.n,fee:r1(fee),y:'T'+C.season};pushNews(`🇧🇷 Recorde do futebol brasileiro: ${esc(p.n)} por ${M(fee)}.`)}
}
// ofertas dos bots pelos jogadores do usuário
function genOffers(n){
 const mine=sq(C.me).filter(p=>p.lk<=C.winIdx&&!p.ln).sort((a,b)=>b.o-a.o);let made=0;
 for(const p of mine){if(made>=n)break;if(Math.random()<.45)continue;
  const best=bestBuyerFor(p,true);if(!best)continue;
  C.offers.push({pid:p.i,club:best.i,fee:r1(p.v*rnd(.9,1.3)),st:'open',tries:0});made++}
}
function buyersFor(p,needBased){
 const out=[];
 C.clubs.forEach(c=>{if(c.i===C.me||c.i===p.c)return;if(!playerWilling(p,c))return;if(c.money<p.v*1.05)return;
  // só clubes do nível do jogador: ele precisa ser útil ao elenco e não estar muito acima do time
  if(p.o>c.pw+5||p.o<c.pw-(needBased?3:6))return;
  if(needBased){const lu=lineupC(c.i).filter(s=>p.ps.some(x=>TYP[x]===TYP[s.pos]));if(!lu.length)return;const cur=Math.min(...lu.map(s=>s.eff));if(p.o<cur+2)return}
  out.push({c,sc:-Math.abs(c.pw-p.o)+rnd(0,4)});
 });
 return out.sort((x,y)=>y.sc-x.sc).map(x=>x.c);
}
function bestBuyerFor(p,needBased){return buyersFor(p,needBased)[0]||null}

// clubes da IA contratam jogadores livres para substituir os da base / repor elenco
function faPass(){
 calcPower();calcPrestige();
 const fa=C.P.filter(p=>p.c<0&&!p.b).sort((a,b)=>b.o-a.o);
 shuffle(C.clubs.filter(c=>c.i!==C.me)).forEach(c=>{
  let k=0;const pl=sq(c.i);
  Object.keys(TMIN).forEach(t=>{if(k>=4)return;const mine=pl.filter(p=>typesOf(p).includes(t));const real=mine.filter(p=>!p.b);
   if(real.length>=TMIN[t]+1)return;
   const cand=fa.find(p=>p.c<0&&typesOf(p).includes(t)&&p.o<=c.pw+4&&p.o>=c.pw-7&&c.pr>=p.lp-3);
   if(cand){cand.c=c.i;cand.ct=ri(1,3);cand.w=r2(baseWage(cand.o,c.i)*rnd(.9,1.1));revalue(cand);cand.fs=0;c.ver++;k++;
    const b=pl.filter(p=>p.b&&typesOf(p).includes(t)).sort((x,y)=>x.o-y.o)[0];if(b){b.c=-1;b.dead=1}}});
 });
 C.P=C.P.filter(p=>!p.dead);reindex();
}
/* ---------- fim de temporada ---------- */
function seasonEnd(){
 const X=C.comps,c=me();const L=X.L[c.lg];const tab=sortTab(L.tab);const pos=tab.findIndex(r=>r.id===C.me)+1;
 const rep={s:C.season,pos,n:tab.length,obj:C.obj,ok:pos<=C.obj.pos,champs:{},evo:[],left:[],loans:[],fin:{...C.fin,end:c.money},top:null};
 LGORD.forEach(k=>{rep.champs[X.L[k].name]=X.L[k].champ;rep.champs[X.CU[k].name]=X.CU[k].champ});
 rep.champs.Champions=X.UCL.champ;rep.champs.Libertadores=X.LIB.champ;rep.champs['Mundial de Clubes']=X.MUN?X.MUN.champ:null;
 // artilheiro da liga do usuário
 const sc=C.P.filter(p=>p.c>=0&&CL(p.c).lg===c.lg).sort((a,b)=>b.gl-a.gl)[0];if(sc)rep.top={n:sc.n,c:CL(sc.c).club,g:sc.gl};
 // próximas vagas
 const nu=[];LGORD.filter(k=>LG[k].ucl).forEach(k=>nu.push(...sortTab(X.L[k].tab).slice(0,LG[k].ucl).map(r=>r.id)));C.nextUCL=nu;
 const br=sortTab(X.L.BRA.tab).map(r=>r.id);let nl=br.slice(0,7);const cc=X.CU.BRA.champ;nl.push(cc!=null&&!nl.includes(cc)?cc:br[7]);C.nextLIB=nl;
 C.holder={ucl:X.UCL.champ,lib:X.LIB.champ};
 // evolução de overall
 C.P.forEach(p=>{if(p.c<0&&p.b)return;if(p.o0==null)p.o0=p.o;let b=0;if(p.ap>=25)b+=.6;else if(p.ap>=12)b+=.15;else if(p.ap<5)b-=.8;else b-=.2;
  if(p.o>=92)b-=1;else if(p.o>=88)b-=.4;if(p.o<76)b+=.5;b-=.25*(p.o-p.o0);
  let d=Math.round(b+rnd(-1.8,1.8));d=clamp(d,-3,3);const o1=p.o;p.o=clamp(p.o+d,60,99);p.d=p.o-o1;if(p.c===C.me&&p.d)rep.evo.push({n:p.n,o:p.o,d:p.d});revalue(p)});
 C.clubs.forEach(x=>x.ver++);
 // contratos
 C.P.forEach(p=>{if(p.c<0)return;p.ct--;});
 // pré-contratos executados
 C.P.forEach(p=>{if(p.pre!=null&&p.ct<=0){const t=p.pre;const from=p.c;p.pre=null;const pc=p.preT||{w:p.w,y:3};doTransfer(p,t,0,pc.w,pc.y,'(pré-contrato)');if(from===C.me)rep.left.push(p.n+' (pré-contrato)')}});
 C.P.forEach(p=>{if(p.c<0||p.ct>0||p.ln)return;
  if(p.c===C.me){rep.left.push(p.n);pushNews(`👋 ${esc(p.n)} saiu do ${esc(me().club)} no fim do contrato.`);p.lp=me().pr;p.c=-1;p.ct=0;me().ver++;return}
  const c=CL(p.c),rank=sq(p.c).sort((a,b)=>b.o-a.o).findIndex(x=>x.i===p.i);
  if(!p.b&&(rank<18&&Math.random()<.95||rank<25&&Math.random()<.6)){p.ct=ri(2,4);p.w=r2(Math.max(p.w,baseWage(p.o,p.c)))}else{p.lp=c.pr;c.ver++;p.c=-1;p.ct=0;if(p.b)p.dead=1}});
 C.P.forEach(p=>{if(p.c<0){p.fs=(p.fs||0)+1;if(p.fs>=3||(p.fs>=2&&p.o<80))p.dead=1}else p.fs=0});
 C.P=C.P.filter(p=>!p.dead);reindex();
 sq(C.me).filter(p=>p.ln).forEach(p=>rep.loans.push(p.i));
 C.lastRep=rep;C.hist.push({s:C.season,club:c.club,pos,n:tab.length,ok:rep.ok,troph:C.troph.filter(t=>t.s===C.season).map(t=>t.n)});
 C.careerFin.push({s:C.season,...rep.fin});
 C.phase='end';cSave();cRender('end');
}
function reindex(){
 const map=new Map();C.P.forEach((p,i)=>{map.set(p.i,i)});C.P.forEach((p,i)=>p.i=i);
 C.clubs.forEach(c=>{if(c.man)c.man=c.man.map(id=>map.has(id)?map.get(id):null);c.ver++});XC.clear();
 if(C.offers)C.offers=C.offers.filter(o=>map.has(o.pid)).map(o=>({...o,pid:map.get(o.pid)}));
}
function resolveLoans(choices){
 sq(C.me).filter(p=>p.ln).forEach(p=>{const ln=p.ln;const buy=ln.type==='obr'||choices[p.i];
  if(buy&&me().money>=ln.price){addMoney(C.me,-ln.price);addMoney(ln.from,ln.price);C.fin.tin=r1(C.fin.tin+ln.price);pushNews(`✅ ${esc(p.n)} foi comprado em definitivo por ${M(ln.price)}.`);checkRecord(p,CL(ln.from).club,me().club,ln.price,C.me);p.ln=null;p.ct=Math.max(p.ct,ln.yrs||3)}
  else{pushNews(`↩️ ${esc(p.n)} voltou para o ${esc(CL(ln.from).club)}.`);p.c=ln.from;p.ln=null;p.ct=Math.max(1,p.ct);p.w=ln.ow||p.w;CL(ln.from).ver++}
  me().ver++});
}
function nextSeason(choices){

 seasonStart(false);pushNews(`📅 Começa a temporada ${C.season}/${NSEAS}.`);goHome();
}

/* ----- negociação ----- */
function askPrice(p){
 const s=CL(p.c),u=me();let m=isKey(p)?1.45:inXI(p)?1.2:.95;if(p.ct===1)m*=.65;let a=p.v*m;
 if(isKey(p)&&u.pr<s.pr-1)a=Math.max(a,p.v*2);return r1(a);
}
function wantWage(p){
 const u=me(),sp=p.c>=0?CL(p.c).pr:p.lp,gap=Math.max(0,sp-u.pr);
 // vir para um clube menor custa caro: cada ponto de prestígio a menos aumenta o salário pedido (mais ainda para craques)
 const f=1+gap*(p.o>=88?.2:.1);
 let w=Math.max(baseWage(p.o,C.me)*f,p.w*1.15*(1+gap*.06));return r2(w);
}
function startNeg(pid,kind){
 const p=PL(pid);let n=C.negs[pid];
 if(!n||n.kind!==kind||n.closed){n={kind,stage:kind==='free'||kind==='pre'?'player':'club',tries:0,ptries:0,msg:'',ask:p.c>=0?askPrice(p):0,want:wantWage(p),yrs:ri(2,5)};
  n.fee=kind==='buy'?r1(n.ask*.85):kind==='loan'?r1(p.v*.08):0;n.price=kind==='loan'?r1(p.c>=0?askPrice(p):p.v):0;n.ltype='opt';n.w=r2(n.want*.9);n.bonus=0;n.y=n.yrs;C.negs[pid]=n}
 const u=me(),sp=p.c>=0?CL(p.c).pr:p.lp;
 n.gap=Math.max(0,r1(sp-u.pr));
 renderNeg(pid);
}
function num(id,v,step,act){return `<div class="stepper"><button class="cbtn" data-act="${act}" data-k="${id}" data-v="-${step}">−</button><b id="${id}">${M(v)}</b><button class="cbtn" data-act="${act}" data-k="${id}" data-v="${step}">+</button></div>`}
function renderNeg(pid){
 const p=PL(pid),n=C.negs[pid],u=me();
 if(n.closed){modal(`<h2>${esc(p.n)}</h2><p>${n.closed}</p>`);return}
 const step=v=>v>=50?5:v>=10?1:v>=2?.5:.1;
 let h=`<div class="row" style="gap:10px">${p.c>=0?crest(CL(p.c)):''}<div class="grow"><h2 style="margin:0">${esc(p.n)} <small class="mut">${p.o}</small></h2><span class="mut small">${p.c>=0?esc(CL(p.c).club):'Livre'} · valor ${M(p.v)} · seu saldo ${M(u.money)}</span></div></div>`;
 h+=`<div class="steps"><span class="${n.stage==='club'?'on':'done'}">1 · Clube</span><span class="${n.stage==='player'?'on':''}">2 · Jogador</span></div>`;
 if(n.stage==='club'){
  if(n.kind==='buy')h+=`<p class="mut small">Proposta de compra definitiva ao ${esc(CL(p.c).club)}.</p><label class="lbl">Taxa de transferência</label>${num('fee',n.fee,step(n.fee),'cNum')}`;
  else h+=`<p class="mut small">Empréstimo por 1 temporada. O ${esc(CL(p.c).club)} pede ${M(n.price)} pela compra no fim.</p>

   <label class="lbl">Taxa de empréstimo</label>${num('fee',n.fee,step(n.fee),'cNum')}<label class="lbl">Valor de compra no fim</label>${num('price',n.price,step(n.price),'cNum')}`;
  h+=n.msg?`<div class="resp">${n.msg}</div>`:'';
  if(n.cask)h+=`<button class="btn block" data-act="cPayC" data-v="${pid}" style="margin-top:10px">Pagar o que pedem</button>`;
  h+=`<button class="btn ac block" data-act="cOffer" data-v="${pid}" style="margin-top:10px">Enviar proposta (${3-n.tries} tentativas)</button>`;
 }else{
  h+=`<p class="mut small">${n.kind==='pre'?'Pré-contrato: ele chega de graça no fim da temporada.':n.kind==='free'?'Jogador livre: sem taxa para clube.':'Acordo com o clube fechado ✅. Agora o contrato do jogador.'} Salário atual: ${M(p.w)}/ano.${n.gap>=1?` <b class="warn">Ele vem de um clube maior, então pede bem mais para aceitar.</b>`:''}</p>
  <label class="lbl">Salário (por ano)</label>${num('w',n.w,step(n.w),'cNum')}<label class="lbl">Luvas (bônus na assinatura)</label>${num('bonus',n.bonus,step(Math.max(n.bonus,n.w)),'cNum')}
  <label class="lbl">Anos de contrato</label><div class="seg">${[1,2,3,4,5].map(y=>`<button class="${n.y===y?'sel':''}" data-act="cYrs" data-v="${y}">${y}</button>`).join('')}</div>`;

function clubAnswer(pid){
 const p=PL(pid),n=C.negs[pid],u=me();n.tries++;
 if(n.fee>u.money){n.msg='💸 Você não tem saldo para essa taxa.';n.tries--;return renderNeg(pid)}
 if(n.kind==='buy'){
  if(n.fee>=n.ask){n.stage='player';n.msg=`✅ O ${esc(CL(p.c).club)} aceitou ${M(n.fee)}.`;n.agreed=n.fee}
  else if(n.fee>=n.ask*.8){n.msg=`↔️ Contraproposta: o clube quer ${M(n.ask)}.`;n.fee=n.ask;n.cask=1}
  else{n.cask=1;n.msg=`❌ Proposta muito baixa. O clube quer ${M(n.ask)}.`}
  if(0)n.msg=`❌ Proposta muito baixa. ${isKey(p)&&u.pr<CL(p.c).pr-1?'Titular importante: só sai por proposta irrecusável.':''}`;
 }else{
  const minF=r1(p.v*.06),minP=r1(n.ask*(n.ltype==='opt'?1.05:.95));
  if(n.fee>=minF&&n.price>=minP){n.stage='player';n.msg=`✅ Empréstimo aceito (${n.ltype==='opt'?'opção':'obrigação'} de compra por ${M(n.price)}).`;n.agreed=n.fee}
  else if((n.cask=1)&&n.fee>=minF*.6){n.msg=`↔️ O clube pede taxa de ${M(Math.max(n.fee,minF))} e compra por ${M(Math.max(n.price,minP))}.`;n.fee=Math.max(n.fee,minF);n.price=Math.max(n.price,minP)}
  else n.msg='❌ O clube recusou a proposta de empréstimo.';
 }
 if(n.stage==='club'&&n.tries>=3){n.closed=`O ${esc(CL(p.c).club)} encerrou as negociações por ${esc(p.n)} nesta janela.`}
 n.msg&&n.stage==='player'&&(n.msg+=' Agora negocie com o jogador.');

}
function playerAnswer(pid){
 const p=PL(pid),n=C.negs[pid],u=me();n.ptries++;
 const cost=(n.kind==='buy'||n.kind==='loan'?n.agreed:0)+n.bonus;
 if(cost>u.money){n.msg='💸 Saldo insuficiente para taxa + luvas.';n.ptries--;return renderNeg(pid)}
 let need=n.want*(Math.abs(n.y-n.yrs)>1?1.05:1);const got=n.w+n.bonus/Math.max(1,n.y);
 if(got>=need*.97){finishDeal(pid);return}
 n.pask=r2(need);
 if(got>=need*.75)n.msg=`↔️ ${esc(p.n)} pede ${M(need)}/ano${n.yrs!==n.y?` e prefere ${n.yrs} anos`:''}.`;
 else n.msg=`❌ ${esc(p.n)} achou a proposta fraca. Ele quer ${M(need)}/ano.`;
 if(n.ptries>=3){n.closed=`${esc(p.n)} encerrou a conversa nesta janela.`}
 renderNeg(pid);
}
function finishDeal(pid){

 if(n.kind==='pre'){p.pre=C.me;p.preT={w:n.w,y:n.y};pushNews(`✍️ Pré-contrato assinado com ${esc(p.n)}: chega no fim da temporada.`);n.closed='✅ Pré-contrato assinado! Ele chega de graça no fim da temporada.'}
 else if(n.kind==='loan'){const from=p.c,ow=p.w;doTransfer(p,C.me,n.agreed,n.w,1,'','loan');p.ln={from,type:n.ltype,price:n.price,yrs:n.y,ow};n.closed=`✅ ${esc(p.n)} chegou por empréstimo!`}
 else{doTransfer(p,C.me,n.agreed||0,n.w,n.y,'');n.closed=`✅ ${esc(p.n)} é o novo reforço do ${esc(u.club)}!`;if(C.win)C.win.moves++}
 me().ver++;me().man=null;calcPower();cSave();cRender();modal(`<h2>Negócio fechado!</h2><p>${n.closed}</p>`);
}

function cMktHTML(){
 const f=CSUB.f||(CSUB.f={pos:'',lg:'',max:0,q:'',free:false});const w=C.win&&C.win.open;
 const offs=C.offers.filter(o=>o.st==='open');

function offerAccept(k){const o=C.offers[k],p=PL(o.pid);if(p.c!==C.me){o.st='x';return cRender()}const b=CL(o.club);if(b.money<o.fee){o.st='x';flashC('O clube desistiu: sem saldo.');return cRender()}
 doTransfer(p,o.club,o.fee,r2(Math.max(p.w*1.1,baseWage(p.o,o.club))),ri(2,5),'');o.st='ok';C.offers.forEach(x=>{if(x.pid===o.pid&&x!==o)x.st='x'});me().man=null;calcPower();if(C.win)C.win.moves++;cSave();cRender()}
function offerCounter(k){const o=C.offers[k];o.tries++;const b=CL(o.club),want=r1(o.fee*1.2);
 if(Math.random()<.55&&b.money>=want){o.fee=want;flashC(`✅ O ${b.club} aceitou pagar ${M(want)}. Agora é só aceitar.`)}else{o.st='x';flashC(`❌ O ${b.club} não subiu a oferta e desistiu.`)}cSave();cRender()}
function sellList(pid){const p=PL(pid);if(C.offers.some(o=>o.pid===pid&&o.st==='open')){closeModal();return cRender('mkt')}
 const bs=buyersFor(p,false).slice(0,ri(1,3));if(!bs.length){modal(`<h2>${esc(p.n)}</h2><p>Nenhum clube do nível dele se interessou agora.</p>`);return}
 bs.forEach(b=>C.offers.push({pid,club:b.i,fee:r1(p.v*rnd(.8,1.1)),st:'open',tries:0}));cSave();closeModal();flashC(`📨 ${bs.length} proposta(s) por ${p.n}`);cRender('mkt')}
function renewModal(pid){
 const p=PL(pid);const want=r2(Math.max(p.w*1.08,baseWage(p.o,C.me)));const n=C.negs['r'+pid]||(C.negs['r'+pid]={w:r2(want*.9),y:3,tries:0,want,msg:''});
 if(n.closed){modal(`<h2>${esc(p.n)}</h2><p>${n.closed}</p>`);return}
 const st=n.w>=10?1:n.w>=2?.5:.1;
 modal(`<h2>Renovar · ${esc(p.n)}</h2><p class="mut small">Salário atual ${M(p.w)}/ano · contrato: ${ctTxt(p)}</p><label class="lbl">Novo salário</label>${num('rw',n.w,st,'cRNum')}<label class="lbl">Anos</label><div class="seg">${[1,2,3,4,5].map(y=>`<button class="${n.y===y?'sel':''}" data-act="cRYrs" data-v="${y}">${y}</button>`).join('')}</div>${n.msg?`<div class="resp">${n.msg}</div>`:''}<button class="btn ac block" data-act="cRenewGo" data-v="${pid}" style="margin-top:10px">Propor (${3-n.tries} tentativas)</button>`);
 $('#modal').dataset.pid=pid;
}
function renewGo(pid){const p=PL(pid),n=C.negs['r'+pid];n.tries++;
 if(n.w>=n.want*.97){p.w=r2(n.w);p.ct=n.y+ (p.ct>0?0:0);p.ct=Math.max(p.ct,n.y);n.closed=`✅ ${esc(p.n)} renovou por ${n.y} temporada(s) com ${M(n.w)}/ano.`;pushNews(`🖊️ ${esc(p.n)} renovou com o ${esc(me().club)}.`);cSave();cRender();return modal(`<h2>Renovado!</h2><p>${n.closed}</p>`)}
 n.msg=n.w>=n.want*.75?`↔️ Ele pede ${M(n.want)}/ano.`:'❌ Proposta fraca.';if(n.tries>=3)n.closed=`${esc(p.n)} não quer mais conversar sobre renovação agora.`;renewModal(pid)}

function tieHTML(t){const leg=t.m.map(m=>`${m.gh}x${m.ga}`).join(' · ');const nm=i=>i==null?'—':`${crest(CL(i),1)}<span class="ell">${esc(CL(i).club)}</span>`;
 return `<div class="tie ${t.a===C.me||t.b===C.me?'mine':''}"><span class="row ${t.w===t.a?'w':''}">${nm(t.a)}</span><b>${t.b==null?'bye':leg||'x'}${t.m.some(m=>m.pens)?' (pên.)':''}</b><span class="row ${t.w===t.b&&t.b!=null?'w':''}" style="justify-content:flex-end">${nm(t.b)}</span></div>`}

 if(C.uclT.includes(C.me)||c.lg!=='BRA')opts.push(['U','Champions']);if(C.libT.includes(C.me)||c.lg==='BRA')opts.push(['B','Libertadores']);
 opts.push(['M','Mundial'],['O','Outras ligas'],['G','Artilharia']);

 else if(t==='B'){const B=X.LIB;h=`<h2>Libertadores</h2><h3>${B.pre.nm}</h3>${B.pre.ties.map(tieHTML).join('')}${B.groups?B.groups.map(g=>`<h3>${g.nm}</h3>${tabT(sortTab(g.tab),1,i=>i===1)}`).join(''):'<p class="mut">Os grupos são sorteados depois da fase preliminar.</p>'}${stagesHTML(B.stages)}${B.champ!=null?`<p class="champ">🏆 Campeão: ${esc(CL(B.champ).club)}</p>`:''}`}
 else if(t==='M'){const Mu=X.MUN;h=`<h2>Mundial de Clubes</h2><p class="mut">Último jogo da temporada: campeão da Champions x campeão da Libertadores, em jogo único.</p>${Mu&&Mu.m?mRow(Mu.m,1)+`<p class="champ">🌍 Campeão: ${esc(CL(Mu.champ).club)}</p>`:`<p>Champions: <b>${X.UCL.champ!=null?esc(CL(X.UCL.champ).club):'a definir'}</b><br>Libertadores: <b>${X.LIB.champ!=null?esc(CL(X.LIB.champ).club):'a definir'}</b></p>`}`}

 else if(t==='G'){const lg=CSUB.gl||c.lg;const top=C.P.filter(p=>p.c>=0&&CL(p.c).lg===lg&&p.gl>0).sort((a,b)=>b.gl-a.gl).slice(0,20);

 return `<div class="chips">${opts.map(([v,l])=>`<button class="${v===sel?'sel':''}" data-act="cTabSel" data-v="${v}">${l}</button>`).join('')}</div><div class="card" style="margin-top:10px">${h}</div>`;

 <h3>Liga</h3><div class="grid3">${LGORD.map(k=>`<button class="opt ${CS.lg===k?'sel':''}" data-act="cLg" data-v="${k}"><b>${flag(k)} ${LG[k].n}</b><span>${C0clubs().filter(c=>c.lg===k).length} times · ${k==='BRA'?'vaga na Libertadores':LG[k].ucl+' vagas na Champions'}</span></button>`).join('')}</div>
 <h3>Time</h3><div class="crests">${clubs.map(c=>`<button class="${CS.club===c.i?'sel':''}" data-act="cClub" data-v="${c.i}">${crest(c)}<span>${esc(c.club)}</span><small class="nota" style="margin:0">${c.pw}</small></button>`).join('')}</div>
 <p class="mut small">O número é a força do time titular. Times mais fracos têm objetivos menores.</p>
 <h3>Dinheiro para contratar</h3>
 <div class="grid2"><button class="opt ${CS.mm==='fair'?'sel':''}" data-act="cMM" data-v="fair"><b>Valor justo</b><span>${M(fairMoney(clubs.find(c=>c.i===CS.club)))} · calculado pela força do time</span></button>
 <button class="opt ${CS.mm==='custom'?'sel':''}" data-act="cMM" data-v="custom"><b>Escolher valor</b><span>Você define quanto o clube tem pra gastar</span></button></div>
 ${CS.mm==='custom'?`<div class="row" style="margin-top:10px;gap:8px"><span style="font:800 22px var(--fd)">€</span><label for="cmoney" class="somente-leitor">Dinheiro inicial em milhões de euros</label><input class="input" id="cmoney" type="number" inputmode="decimal" min="0" step="1" placeholder="Ex.: 150" value="${esc(String(CS.money))}" style="flex:1"><span style="font:800 22px var(--fd)">M</span></div><p class="mut small">Só o seu clube recebe esse valor; os outros clubes continuam com o valor justo.</p>`:''}
 <button class="btn ac block" data-act="cStart" style="margin:18px 0 30px" ${CS.name.trim()?'':'disabled'}>Começar carreira ▶</button></main>${FOOT}`;
}
let C0=null;
function C0clubs(){
 if(C0)return C0;const saved=C;const d=cBuild();C={clubs:d.clubs,P:d.P,uclT:[],libT:[]};
 C.clubs.forEach(c=>fillSquad(c.i));C.clubs.forEach(c=>c.pw=r1(powerOf(c.i)));C0=C.clubs.map(c=>({...c}));C=saved;XC.clear();return C0;
}

/* ----- partida ao vivo ----- */
let CLV=null;
function cLive(){
 const D=prepDay(),fi=D.F.findIndex(f=>f.h===C.me||f.a===C.me),f=D.F[fi];
 simOthers(true);
 const m=newM(f.h,f.a,f.ko,f.ah,f.aa);CLV={m,f,fi,speed:1,iv:null,subs:0,used:new Set(xiOf(C.me)),pre:me().man?[...me().man]:null,preForm:me().form};
 me().man=[...xiOf(C.me)];
 app.innerHTML=cHead()+`<main class="wrap layout"><div><div class="card"><div class="board">
  <div class="score"><div class="grow">${crest(CL(m.h))}<br>${esc(CL(m.h).club)}</div><div class="n" id="gh">0</div><div class="mut">x</div><div class="n" id="ga">0</div><div class="grow">${crest(CL(m.a))}<br>${esc(CL(m.a).club)}</div></div>
  <div style="text-align:center;margin-top:8px"><span class="tag" id="min">0'</span>${f.ah||f.aa?`<div class="mut small" id="agg"></div>`:''}</div></div>
  <div class="seg" style="margin-top:12px">${[1,2,4].map(v=>`<button data-act="cSpd" data-v="${v}" class="${v===1?'sel':''}">${v}x</button>`).join('')}<button data-act="cPause" id="pz">Pausar</button><button data-act="cSkip">Pular ⏭</button></div>
  <div id="evs" style="margin-top:10px" aria-live="polite" aria-label="Lances do jogo"></div><button class="btn ac block hide" id="cont" data-act="cCont" style="margin-top:12px">Continuar</button></div></div>
 <div class="card"><div class="row"><b class="grow">Mexa no time</b><span class="tag" id="subs">0/5 trocas</span></div><div id="lp" style="margin-top:8px">${cPitch(C.me,'cLSlot')}</div><div id="lf" style="margin-top:10px">${formsHTML(11,me().form,'cLForm')}</div><div id="lt">${tacHTMLc('cLTac')}</div></div></main><div id="modal"></div>`;
 cRun();
}
function cRun(){clearInterval(CLV.iv);CLV.iv=setInterval(()=>{const m=CLV.m;if(mOver(m))return cEndLive();mStep(m);cUpd()},260/CLV.speed)}
function cUpd(){const m=CLV.m;$('#gh').textContent=m.gh;$('#ga').textContent=m.ga;
 $('#min').textContent=m.min>90?`${m.min}' prorrogação`:m.min+"'";const ag=$('#agg');if(ag)ag.textContent=`Agregado: ${m.gh+m.ah} x ${m.ga+m.aa}`;
 $('#evs').innerHTML=[...m.ev].reverse().map(e=>`<div class="ev">⚽ <b>${e.min}'</b> ${e.pid!=null?esc(PL(e.pid).n):'?'} <span class="mut">(${esc(CL(e.side==='h'?m.h:m.a).club)})</span></div>`).join('')+(m.pens?`<div class="ev">🥅 Pênaltis: <b>${m.pens.h} x ${m.pens.a}</b></div>`:'');}
function cEndLive(){clearInterval(CLV.iv);const m=CLV.m;cUpd();const w=m.ko?mWin(m):(m.gh>m.ga?m.h:m.ga>m.gh?m.a:null);
 $('#min').textContent='Fim de jogo'+(w===C.me?' · VITÓRIA!':w==null?' · empate':' · derrota');$('#cont').classList.remove('hide');CLV.done=true}
function cContLive(){/*fim*/const D=prepDay();applyRes(CLV.f,CLV.m);D.done.add(CLV.fi);const c=me();c.man=CLV.pre?(c.form===CLV.preForm?CLV.pre:placeXI(CLV.pre.map(PL),c.form)):null;CLV=null;finishDay();goHome()}
function cQuick(){const D=prepDay();simOthers(false);finishDay();goHome()}

/* ----- ações ----- */
Object.assign(ACT,{
 goCarreira(){C0clubs();renderCSetup()},
 cLg(b){CS.lg=b.dataset.v;CS.club=null;renderCSetup()},
 cClub(b){CS.club=+b.dataset.v;renderCSetup()},
 cStart(){if(!CS.name.trim())return;const v=parseFloat(String(CS.money).replace(',','.'));const sm=CS.mm==='custom'&&isFinite(v)&&v>=0?v:null;cNew(CS.name.trim(),CS.club,sm);cSave();goHome()},
 cMM(b){CS.mm=b.dataset.v;renderCSetup()},
 cContinue(){C=cLoad();XC.clear();PEND=null;if(!C){renderCSetup();return}if(C.phase==='end'||C.phase==='over')cRender(C.phase);else goHome()},
 cAbandon(){modal(`<h2>Apagar a carreira?</h2><p>A carreira salva será apagada e não dá pra desfazer.</p><button class="btn block" data-act="cAbandonYes" style="border-color:#c0392b">Sim, apagar</button>`)},
 cAbandonYes(){cDel();C=null;PEND=null;CS={name:'',lg:'ING',club:null,mm:'fair',money:''};renderCSetup()},
 cNewSetup(){cDel();C=null;CS={name:'',lg:'ING',club:null,mm:'fair',money:''};renderCSetup()},
 cMenu(){if(CLV&&!CLV.done)return;renderHome()},
 cTab(b){CT=b.dataset.v;cRender()},
 cAdv(){advance()},cToMine(){simToMine()},
 cQuick(){cQuick()},cLive(){cLive()},
 cCloseWin(){closeWindow();goHome()},
 cSlot(b){slotPick(+b.dataset.v)},
 cSwap(b){doSwap(+b.dataset.v,+b.dataset.k);closeModal();if(CLV){CLV.subs+=0;$('#lp').innerHTML=cPitch(C.me,'cLSlot')}else cRender()},
 cForm(b){const c=me();const pl=xiOf(C.me).filter(x=>x!=null).map(PL);c.form=b.dataset.v;if(c.man)c.man=placeXI(pl,c.form);c.pw=r1(powerOf(C.me));cRender()},
 cTac(b){me().tac[b.dataset.k]=b.dataset.v;cRender()},
 cAutoXI(){me().man=null;XC.delete(C.me);me().pw=r1(powerOf(C.me));cRender()},
 cPlayer(b){playerModal(+b.dataset.v)},
 cClose(){closeModal();if(!CLV&&C&&(CT==='squad'||CT==='mkt'))cRender()},
 cNeg(b){startNeg(+b.dataset.v,b.dataset.k)},
 cNum(b){const pid=+$('#modal').dataset.pid,n=C.negs[pid];const k=b.dataset.k;n[k]=r2(Math.max(0,(n[k]||0)+ +b.dataset.v));renderNeg(pid)},
 cLt(b){const pid=+$('#modal').dataset.pid,n=C.negs[pid];n.ltype=b.dataset.v;renderNeg(pid)},
 cYrs(b){const pid=+$('#modal').dataset.pid,n=C.negs[pid];n.y=+b.dataset.v;renderNeg(pid)},
 cOffer(b){clubAnswer(+b.dataset.v)},
 cPayC(b){const pid=+b.dataset.v,n=C.negs[pid];n.fee=n.ask;if(n.kind==='loan'){n.fee=Math.max(n.fee,r1(PL(pid).v*.06));n.price=Math.max(n.price,r1(n.ask*(n.ltype==='opt'?1.05:.95)))}n.tries=Math.max(0,n.tries-1);clubAnswer(pid)},
 cPayP(b){const pid=+b.dataset.v,n=C.negs[pid];n.w=n.pask;n.ptries=Math.max(0,n.ptries-1);playerAnswer(pid)},cOfferP(b){playerAnswer(+b.dataset.v)},
 cOffAcc(b){offerAccept(+b.dataset.v)},cOffRej(b){C.offers[+b.dataset.v].st='x';cSave();cRender()},cOffCnt(b){offerCounter(+b.dataset.v)},
 cSellList(b){sellList(+b.dataset.v)},
 cRenew(b){renewModal(+b.dataset.v)},
 cRNum(b){const pid=+$('#modal').dataset.pid,n=C.negs['r'+pid];n.w=r2(Math.max(0,n.w+ +b.dataset.v));renewModal(pid)},
 cRYrs(b){const pid=+$('#modal').dataset.pid,n=C.negs['r'+pid];n.y=+b.dataset.v;renewModal(pid)},
 cRenewGo(b){renewGo(+b.dataset.v)},
 cTabSel(b){CSUB.tab=b.dataset.v;cRender()},cOL(b){CSUB.ol=b.dataset.v;cRender()},cGL(b){CSUB.gl=b.dataset.v;cRender()},
 cClubSub(b){CSUB.club=b.dataset.v;cRender()},
 cNextS(){const ch={};document.querySelectorAll('.lnbuy').forEach(x=>{if(x.checked)ch[+x.dataset.v]=true});nextSeason(ch)},
 cSpd(b){CLV.speed=+b.dataset.v;CLV.paused=false;$('#pz').textContent='Pausar';document.querySelectorAll('[data-act=cSpd]').forEach(x=>x.classList.toggle('sel',x===b));cRun()},
 cPause(){if(CLV.done)return;CLV.paused=!CLV.paused;$('#pz').textContent=CLV.paused?'Retomar':'Pausar';if(CLV.paused)clearInterval(CLV.iv);else cRun()},
 cSkip(){clearInterval(CLV.iv);while(!mOver(CLV.m))mStep(CLV.m);cEndLive()},
 cCont(){cContLive()},
 cLForm(b){const c=me();const pl=xiOf(C.me).filter(x=>x!=null).map(PL);c.form=b.dataset.v;c.man=placeXI(pl,c.form);$('#lp').innerHTML=cPitch(C.me,'cLSlot');$('#lf').innerHTML=formsHTML(11,c.form,'cLForm')},
 cLTac(b){me().tac[b.dataset.k]=b.dataset.v;$('#lt').innerHTML=tacHTMLc('cLTac')},
 cLSlot(b){if(CLV.done)return;const i=+b.dataset.v;const xi=xiOf(C.me),sl=slotList(me().form)[i];
  const bench=sq(C.me).filter(p=>!xi.includes(p.i)).map(p=>({p,e:effC(p,sl),ok:!CLV.used.has(p.i)})).sort((a,b)=>b.e-a.e);
  const others=xi.map((id,j)=>({id,j})).filter(x=>x.j!==i&&x.id!=null);
  modal(`<h2>${sl.pos} · ${xi[i]!=null?esc(PL(xi[i]).n):'vazio'}</h2><p class="mut small">Substituições: ${CLV.subs}/5. Trocar posição entre titulares é livre.</p>
  <b>Do banco</b><div class="plist">${bench.map(x=>`<button class="pl" ${!x.ok||CLV.subs>=5?'disabled':''} data-act="cLSub" data-v="${i}" data-k="${x.p.i}"><span class="ov">${x.e}</span><span class="nm">${esc(x.p.n)}<small>${posTxt(x.p)}${!x.ok?' · já saiu do jogo':''}</small></span></button>`).join('')}</div>
  <b>Trocar de lugar com</b><div class="plist">${others.map(x=>`<button class="pl" data-act="cLMove" data-v="${i}" data-k="${x.id}"><span class="ov">${effC(PL(x.id),sl)}</span><span class="nm">${esc(PL(x.id).n)}<small>${posTxt(PL(x.id))}</small></span></button>`).join('')}</div>`)},
 cLSub(b){if(CLV.subs>=5)return;const i=+b.dataset.v,pid=+b.dataset.k;const xi=[...xiOf(C.me)];if(xi[i]!=null)CLV.used.add(xi[i]);CLV.used.add(pid);xi[i]=pid;me().man=xi;CLV.subs++;$('#subs').textContent=CLV.subs+'/5 trocas';closeModal();$('#lp').innerHTML=cPitch(C.me,'cLSlot')},
 cLMove(b){doSwap(+b.dataset.v,+b.dataset.k);closeModal();$('#lp').innerHTML=cPitch(C.me,'cLSlot')}
});
document.addEventListener('input',e=>{
 if(e.target.id==='cmoney'){CS.money=e.target.value}
 if(e.target.id==='cnm'){CS.name=e.target.value;const b=document.querySelector('[data-act=cStart]');if(b)b.disabled=!CS.name.trim()}
 if(e.target.id==='mq'){CSUB.f.q=e.target.value;clearTimeout(window._mq);window._mq=setTimeout(()=>{const pos=e.target.selectionStart;cRender();const q=$('#mq');if(q){q.focus();q.setSelectionRange(pos,pos)}},350)}
});
document.addEventListener('change',e=>{
 const id=e.target.id;if(!CSUB.f)return;
 if(id==='mpos')CSUB.f.pos=e.target.value;else if(id==='mlg')CSUB.f.lg=e.target.value;else if(id==='mmax')CSUB.f.max=+e.target.value;else if(id==='mfree')CSUB.f.free=e.target.checked;else return;
 cRender();
});

const CONS_KEY='futfut_privacidade';
function zCons(){try{const s=localStorage.getItem(CONS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function zCanSave(){const c=zCons();return!!(c&&c.salvar)}
function zSetCons(v){
 try{localStorage.setItem(CONS_KEY,JSON.stringify({salvar:v,data:new Date().toISOString()}))}catch(e){}
 if(!v){try{Object.keys(localStorage).forEach(k=>{if(k!==CONS_KEY&&k.startsWith('futfut'))localStorage.removeItem(k)})}catch(e){}}
}
